<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مبادئ القانون | الفرقة الأولى</title>
    <link rel="preconnect" href="https://cdn.tailwindcss.com">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: 'Cairo', sans-serif; background-color: #040711; color: #f8fafc;
            height: 100dvh; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative;
        }
        .ambient-canvas { position: fixed; inset: 0; z-index: 0; pointer-events: none; background: radial-gradient(circle at 50% 0%, #0f172a 0%, #040711 78%); }
        .orb-1 { position: absolute; width: 280px; height: 280px; border-radius: 50%; filter: blur(55px); opacity: 0.4; background: radial-gradient(circle, #06b6d4, #3b82f6); top: -10%; right: -10%; transform: translate3d(0,0,0); }
        .orb-2 { position: absolute; width: 300px; height: 300px; border-radius: 50%; filter: blur(55px); opacity: 0.4; background: radial-gradient(circle, #8b5cf6, #ec4899); bottom: -15%; left: -10%; transform: translate3d(0,0,0); }
        .liquid-glass {
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.82) 0%, rgba(15, 23, 42, 0.62) 100%);
            backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.15);
            box-shadow: 0 20px 45px -12px rgba(0, 0, 0, 0.75), inset 0 1px 1px 0 rgba(255, 255, 255, 0.28); transform: translate3d(0,0,0);
        }
        .liquid-input { background: rgba(10,15,30,0.85); border: 1px solid rgba(255,255,255,0.16); }
        .setup-box { background: rgba(15,23,42,0.75); border: 1px solid rgba(255,255,255,0.12); transition: 0.2s; }
        .setup-box.active { background: rgba(6,182,212,0.22); border-color: rgba(56,189,248,0.75); box-shadow: 0 0 15px rgba(6,182,212,0.2); }
        .option-btn { background: rgba(255,255,255,0.045); border: 1px solid rgba(255,255,255,0.13); transition: all 0.2s ease; }
        .option-btn:hover:not(:disabled) { background: rgba(255,255,255,0.09); border-color: rgba(56,189,248,0.5); transform: translateX(-3px); }
        .option-btn.correct { background: rgba(16,185,129,0.25) !important; border-color: #10b981 !important; color: #6ee7b7 !important; }
        .option-btn.wrong { background: rgba(244,63,94,0.25) !important; border-color: #f43f5e !important; color: #fda4af !important; }
        .glow-btn { background: linear-gradient(135deg, #06b6d4 0%, #3b82f6 50%, #8b5cf6 100%); box-shadow: 0 10px 25px -5px rgba(59, 130, 246, 0.5); }
    </style>
</head>
<body class="p-3">

    <!-- 📢 شريط الإشعارات العاجل (Live Broadcast) -->
    <div id="live-broadcast-bar" class="hidden w-full max-w-2xl mx-auto bg-gradient-to-r from-rose-500/90 via-purple-600/90 to-cyan-500/90 border border-white/25 text-white text-[11px] sm:text-xs font-black py-1.5 px-3.5 text-center z-50 shadow-lg shrink-0 mb-2 rounded-2xl flex items-center justify-between gap-2">
        <span id="live-broadcast-text" class="truncate mx-auto"></span>
        <button onclick="document.getElementById('live-broadcast-bar').classList.add('hidden')" class="text-white/80 hover:text-white text-[10px] font-black px-1.5 rounded bg-black/20 shrink-0">✕</button>
    </div>

    <div class="ambient-canvas"><div class="orb-1"></div><div class="orb-2"></div></div>

    <div class="liquid-glass rounded-3xl p-4 sm:p-6 w-full max-w-2xl max-h-[95dvh] flex flex-col justify-between overflow-hidden relative z-10 flex-1">
        
        <!-- الهيدر العلوي -->
        <div class="flex items-center justify-between gap-2 pb-2.5 mb-2 border-b border-white/10 shrink-0">
            <a href="index.html" class="bg-white/5 hover:bg-white/10 border border-white/10 px-3 py-1.5 rounded-xl text-xs font-extrabold transition">→ مواد الفرقة</a>
            <h1 class="text-xs sm:text-base font-black text-cyan-300 truncate">⚖️ مادة مبادئ القانون</h1>
            <button id="reopen-setup" onclick="openSetup()" class="hidden bg-cyan-500/20 border border-cyan-400/40 text-cyan-200 px-3 py-1.5 rounded-xl text-xs font-black hover:bg-cyan-500/30 transition">⚙️ الإعدادات</button>
        </div>

        <!-- 1. شاشة إعدادات الاختبار -->
        <div id="setup-screen" class="space-y-3 text-right overflow-y-auto">
            <div class="bg-slate-900/90 border border-cyan-400/35 rounded-2xl p-4 space-y-3">
                <div class="flex items-center justify-between border-b border-white/10 pb-2.5">
                    <div>
                        <h2 class="text-sm font-black text-white">⚙️ إعدادات وتخصيص الاختبار</h2>
                        <p class="text-[10px] text-slate-400">اضبط خياراتك المفضلة قبل الانطلاق</p>
                    </div>
                    <div class="flex items-center gap-2">
                        <span class="text-xs font-black bg-cyan-500/15 text-cyan-300 px-2.5 py-1 rounded-lg border border-cyan-400/30">المتاح: <span id="avail-count">0</span> سؤال</span>
                        <button id="resume-quiz-btn" onclick="resumeQuiz()" class="hidden bg-emerald-500/20 border border-emerald-400/40 text-emerald-300 px-2.5 py-1 rounded-lg text-xs font-black hover:bg-emerald-500/30 transition">
                            ✕ عودة للامتحان
                        </button>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <button type="button" id="mode-mcq" onclick="switchMode('mcq')" class="setup-box active p-2.5 rounded-xl font-black text-xs text-center">📝 اختيار من متعدد</button>
                    <button type="button" id="mode-tf" onclick="switchMode('tf')" class="setup-box p-2.5 rounded-xl font-black text-xs text-center">✅ صح وخطأ</button>
                </div>

                <div class="grid grid-cols-3 gap-2 text-center">
                    <button type="button" id="box-shuffle" onclick="toggleShuffle()" class="setup-box p-2.5 rounded-xl">
                        <div class="text-base">🔢</div>
                        <div class="font-black text-[11px]">الترتيب</div>
                        <div id="txt-shuffle" class="text-[10px] text-cyan-300 font-bold">عادي</div>
                    </button>
                    <button type="button" id="box-qnum" onclick="toggleQNum()" class="setup-box active p-2.5 rounded-xl">
                        <div class="text-base">🆔</div>
                        <div class="font-black text-[11px]">رقم السؤال</div>
                        <div id="txt-qnum" class="text-[10px] text-cyan-300 font-bold">ظاهر</div>
                    </button>
                    <button type="button" id="box-timer" onclick="toggleTimer()" class="setup-box p-2.5 rounded-xl">
                        <div class="text-base">⏱️</div>
                        <div class="font-black text-[11px]">المؤقت</div>
                        <div id="txt-timer" class="text-[10px] text-cyan-300 font-bold">معطل</div>
                    </button>
                </div>

                <div id="timer-row" class="hidden bg-amber-500/10 border border-amber-400/30 rounded-xl p-2.5 items-center justify-between">
                    <span class="text-xs font-bold text-amber-200">⏳ مدة الاختبار بالدقائق:</span>
                    <input type="number" id="timer-mins" min="1" value="15" class="liquid-input w-16 rounded-lg px-2 py-1 text-center text-xs font-black text-amber-300">
                </div>

                <div class="grid grid-cols-2 gap-2.5 bg-white/[0.03] border border-white/10 p-2.5 rounded-xl">
                    <div class="flex items-center justify-between">
                        <span class="text-xs font-bold">من السؤال:</span>
                        <input type="number" id="q-start" min="1" value="1" class="liquid-input w-16 rounded-lg px-2 py-1 text-center text-xs font-black">
                    </div>
                    <div class="flex items-center justify-between">
                        <span class="text-xs font-bold">إلى السؤال:</span>
                        <input type="number" id="q-end" min="1" value="10" class="liquid-input w-16 rounded-lg px-2 py-1 text-center text-xs font-black">
                    </div>
                </div>

                <div class="flex gap-2">
                    <button type="button" onclick="startQuizNow()" class="glow-btn flex-1 py-3 rounded-xl font-black text-xs sm:text-sm text-white transition hover:scale-[1.01]">🚀 تطبيق الإعدادات وبدء الاختبار</button>
                    <button type="button" id="resume-bottom-btn" onclick="resumeQuiz()" class="hidden bg-white/10 hover:bg-white/15 text-white font-bold px-4 py-3 rounded-xl text-xs">استكمال الامتحان الحالي</button>
                </div>
            </div>
        </div>

        <!-- 2. شاشة الامتحان التفاعلي -->
        <div id="quiz-stage" class="hidden flex-col justify-between overflow-hidden flex-1">
            <div class="bg-white/[0.04] border border-white/10 rounded-xl p-1.5 mb-2 flex items-center justify-between gap-1.5 text-[11px] font-bold shrink-0">
                <div class="flex items-center gap-1 flex-wrap">
                    <button onclick="quickToggleQNum()" id="bar-qnum" class="bg-cyan-500/20 text-cyan-300 px-2.5 py-1 rounded-lg border border-cyan-400/30">🆔 الرقم: ظاهر</button>
                    <button onclick="openSetup()" class="bg-white/5 hover:bg-white/10 text-slate-300 px-2.5 py-1 rounded-lg border border-white/10">🎯 النطاق</button>
                    <button onclick="showBookmarks()" id="top-bookmarks-btn" class="hidden bg-amber-500/20 text-amber-300 px-2.5 py-1 rounded-lg border border-amber-400/30">⭐ المحفوظة (<span id="saved-count-top">0</span>)</button>
                </div>
                <span id="timer-disp" class="hidden bg-amber-500/20 text-amber-300 px-2.5 py-1 rounded-lg border border-amber-400/30 font-mono">⏳ 15:00</span>
            </div>

            <div class="w-full h-1.5 bg-white/10 rounded-full overflow-hidden mb-2.5 shrink-0">
                <div id="progress-fill" class="h-full bg-gradient-to-r from-cyan-400 via-blue-500 to-purple-500 transition-all duration-300" style="width: 0%"></div>
            </div>

            <div class="grid grid-cols-3 gap-2 mb-2.5 text-center text-xs font-black shrink-0">
                <div class="bg-emerald-500/10 border border-emerald-500/25 rounded-xl py-1.5 text-emerald-400">✅ صح: <span id="correct-count">0</span></div>
                <div class="bg-rose-500/10 border border-rose-500/25 rounded-xl py-1.5 text-rose-400">❌ خطأ: <span id="wrong-count">0</span></div>
                <div class="bg-cyan-500/10 border border-cyan-500/25 rounded-xl py-1.5 text-cyan-300">سؤال <span id="q-curr">1</span> من <span id="q-total">0</span></div>
            </div>

            <div id="quiz-container" class="overflow-y-auto py-1 flex-1 flex flex-col justify-between">
                <!-- يتم تعبئتها بالجافاسكريبت (السؤال + النجمة + الاختيارات) -->
            </div>
        </div>
    </div>

    <script>
        if (!sessionStorage.getItem("basmagia_user")) window.location.href = "../index.html";

        const banks = {
            mcq: [
  { "t": "من خصائص القاعدة القانونية وتتحقق عند وضعها وقبل تطبيقها :", "o": ["العمومية", "التجريد", "التنظيم", "ليس أيا مما سبق"], "a": 1 },
  { "t": "علاقة الموظف بالدولة تخضع لقواعد القانون :", "o": ["المدني", "الدولي", "الإداري", "العمل"], "a": 2 },
  { "t": "فكرة نسبية تختلف باختلاف الزمان والمكان وتعتبر جزء من الأخلاق العامة في المجتمع :", "o": ["الآداب العامة", "النظام العام", "محاكم الأسرة", "قواعد الضبط والبوليس"], "a": 0 },
  { "t": "قد يكون منحة من الحاكم للشعب :", "o": ["التشريع", "القانون", "الدستور", "العرف"], "a": 2 },
  { "t": "أشد أنواع الجزاء ويمس الحرية الشخصية :", "o": ["المدني", "الجنائي", "الإداري", "التأديبي"], "a": 1 },
  { "t": "ينظم عمل المنظمات الدولية :", "o": ["القانون الدستوري", "القانون الدولي الخاص", "القانون الدولي العام", "القانون الإداري"], "a": 2 },
  { "t": "تعتبر قواعد القانون العام كلها :", "o": ["قواعد مكملة", "قواعد آمرة", "قواعد اتفاقية", "قواعد عرفية"], "a": 1 },
  { "t": "يعتبر من أهم فروع القانون الخاص ويسمى بأبو القوانين :", "o": ["القانون المدني", "القانون الجنائي", "القانون الدولي", "القانون الدستوري"], "a": 0 },
  { "t": "مجموع قواعد السلوك الملزمة لأفراد المجتمع :", "o": ["الحق", "القانون", "الواجب", "العرف"], "a": 1 },
  { "t": "الحق والواجب :", "o": ["متنافران", "متلازمان", "متماثلان", "متوارثان"], "a": 1 },
  { "t": "الأساس السياسي والخلقي والاجتماعي الذي يسود في المجتمع :", "o": ["الدستور", "النظام العام", "التشريع", "الآداب العامة"], "a": 1 },
  { "t": "من أهم مزاياه التعرف على قواعد القانون في فرع من فروعه :", "o": ["التقنين", "العرف", "الدستور", "التشريع"], "a": 0 },
  { "t": "مجموعة القواعد التي تحكم عمل السلطة القضائية :", "o": ["قانون العقوبات", "قانون المرافعات", "قانون العمل", "قانون الاجراءات الجنائية"], "a": 1 },
  { "t": "هو الجزاء الذي يوقع حال مخالفة أحد قواعد القانون الإداري :", "o": ["الجزاء المدني", "الجزاء الجنائي", "الجزاء الاداري", "الجزاء التأديبي"], "a": 2 },
  { "t": "تقترن القاعدة الأخلاقية بجزاء :", "o": ["مادي", "أدبي", "فوري", "مالي"], "a": 1 },
  { "t": "قد يكون في صورة اتفاق بين الحاكم والشعب :", "o": ["العرف", "الدستور", "القانون", "التشريع"], "a": 1 },
  { "t": "روابط يغلب عليها الطابع الشخصي :", "o": ["الروابط الأسرية", "الروابط التنظيمية", "الروابط الاقتصادية", "الروابط السياسية"], "a": 0 },
  { "t": "يتمثل الجزاء المدني في عدة صور :", "o": ["التنفيذ العيني", "التعويض", "البطلان والفسخ", "كل ما سبق"], "a": 3 },
  { "t": "تسمو بالنفس البشرية في علاقة الانسان بربه :", "o": ["قواعد الأخلاق", "قواعد الدين", "قواعد المجاملات", "قواعد القانون"], "a": 1 },
  { "t": "تنظم قواعده حق الملكية وطرق انتقاله واستعماله وانقضاؤه :", "o": ["القانون المدني", "قانون العمل", "قانون الأحوال الشخصية", "القانون الدستوري"], "a": 0 }
            ],
            tf: [
  { "t": "تطبق مبادئ الشريعة الإسلامية في مسائل الأحوال الشخصية", "o": ["True", "False"], "a": 0 },
  { "t": "صفة العمومية والتجريد للقاعدة القانونية لا يعني أن تظل القاعدة أبدية", "o": ["True", "False"], "a": 0 },
  { "t": "تعد قواعد القانون العام قواعد قانونية مكملة غير ملزمة للأفراد", "o": ["True", "False"], "a": 1 },
  { "t": "تعد فكرتي النظام العام والآداب العامة من الأفكار النسبية التي تختلف باختلاف الزمان والمكان", "o": ["True", "False"], "a": 0 },
  { "t": "لا تعتبر النية ذات اعتبار في القانون بشكل عام الا في حالات معينة", "o": ["True", "False"], "a": 0 },
  { "t": "يعتبر الدستور المصري من الدساتير المرنة", "o": ["True", "False"], "a": 1 },
  { "t": "تتكون الآداب العامة في المجتمع نتيجة الموروثات من العقيدة والمبادئ والعرف وتختلف من مجتمع لآخر ومن وقت لآخر", "o": ["True", "False"], "a": 0 },
  { "t": "لكل حق دعوى قضائية تحميه وتتبعه وتلازمه حتى انقضاءه", "o": ["True", "False"], "a": 0 },
  { "t": "تمثل الغاية فارقا واضحا ومهما بين الأخلاق والقانون", "o": ["True", "False"], "a": 0 },
  { "t": "قد يصدر القانون ليطبق على شخص واحد بصفته", "o": ["True", "False"], "a": 0 },
  { "t": "قانون العمل يضم مجموعة القواعد القانونية التي تنظم العلاقة بين العامل وصاحب العمل", "o": ["True", "False"], "a": 0 },
  { "t": "تتأثر فكرتي النظام العام والآداب العامة بالموروثات والمعتقدات السائدة في كل مجتمع", "o": ["True", "False"], "a": 0 },
  { "t": "تنظم قواعد قانون العقوبات كلا من الجريمة والعقوبة", "o": ["True", "False"], "a": 0 },
  { "t": "العرف مصدر من مصادر التشريع", "o": ["True", "False"], "a": 1 },
  { "t": "تداخل الجزاءات يعني توقيع أكثر من جزاء على المخالفة الواحدة", "o": ["True", "False"], "a": 0 },
  { "t": "اللائحة التنفيذية قد تصدر مصاحبة للقانون أو تصدر مستقلة عنه", "o": ["True", "False"], "a": 1 },
  { "t": "تصدر لائحة المرور عن السلطة التشريعية وهي البرلمان", "o": ["True", "False"], "a": 1 },
  { "t": "الدستور صورة من صور التشريعات", "o": ["True", "False"], "a": 0 },
  { "t": "تعد قواعد العدالة من المصادر الاحتياطية للقانون", "o": ["True", "False"], "a": 0 },
  { "t": "رئيس الجمهورية هو الرئيس الأعلى للسلطة القضائية", "o": ["True", "False"], "a": 1 }
            ]
        };

        let currentMode = 'mcq', rawQuestions = [], activeQuestions = [], wrongList = [], bookmarkedList = [];
        let curr = 0, correct = 0, wrong = 0, isShuffle = false, showNum = true, isTimer = false, timerInt = null, timeLeft = 0, isQuizRunning = false;

        function isTrialRestricted() {
            const isFreeMode = localStorage.getItem("basmagia_free_mode") !== "false";
            const savedUser = JSON.parse(sessionStorage.getItem("basmagia_user") || "{}");
            return !isFreeMode && (savedUser.code === "TRIAL10" || savedUser.code === "FREE" || savedUser.role === "trial") && savedUser.role !== "admin";
        }

        function getTrialsUsed() {
            // مشترك على مستوى المتصفح بالكامل في جميع المواد
            return parseInt(localStorage.getItem("basmagia_free_trials_used") || "0");
        }

        function updateTrialNoticeUI() {
            // نبقي الأمر مفاجأة للطالب فلا نعرض له أي تنبيه مسبق في الإعدادات
        }

        function showTrialExhaustedScreen() {
            if (timerInt) clearInterval(timerInt);
            isQuizRunning = false;
            document.getElementById('setup-screen').classList.add('hidden');
            document.getElementById('quiz-stage').classList.remove('hidden');
            document.getElementById('quiz-stage').classList.add('flex');
            document.getElementById('reopen-setup').classList.add('hidden');
            const savedUser = JSON.parse(sessionStorage.getItem("basmagia_user") || "{}");
            document.getElementById('quiz-container').innerHTML = `
                <div class="text-center py-4 px-2 space-y-3 my-auto">
                    <div class="w-16 h-16 rounded-2xl bg-amber-500/20 border-2 border-amber-400/50 flex items-center justify-center text-3xl mx-auto shadow-lg shadow-amber-500/20">🔒</div>
                    <span class="text-[10px] font-extrabold bg-rose-500/20 text-rose-300 border border-rose-400/30 px-3 py-0.5 rounded-full">انتهت التجربة المجانية للمنصة</span>
                    <h3 class="text-base sm:text-xl font-black text-white">لقد استنفدت محاولات التجربة المجانية!</h3>
                    <p class="text-xs text-slate-300 leading-relaxed max-w-md mx-auto">
                        يا بطل، لقد قمت بتجربة نظام الاختبار المجاني مرتين بنجاح.<br>
                        لفتح <b>بنك الأسئلة الكامل (${rawQuestions.length} سؤال)</b> في مادة مبادئ القانون وجميع المواد بلا حدود، اشترك الآن واستلم كود التفعيل الخاص بجهازك فوراً.
                    </p>
                    <div class="bg-slate-900/90 border border-white/10 rounded-2xl p-3 text-right text-[11px] text-slate-200 space-y-1 max-w-md mx-auto">
                        <div>✨ فتح جميع أسئلة الاختيارات والصح والخطأ بلا حدود</div>

                        wrongList.push({ id: q.id, q: q.t, sel: opt, cor: q.o[q.a] });

                    setTimeout(() => { curr++; loadQ(); }, 650);
                };
                cont.appendChild(btn);

        window.setRating = function(n) {
            selectedStars = n;
            const spans = document.querySelectorAll("#star-rating span");
            spans.forEach((s, idx) => { s.style.opacity = idx < n ? "1" : "0.25"; });
        };
        window.submitStudentFeedback = async function(subjectName, cor, tot) {
            const txtEl = document.getElementById("feedback-text");
            const msg = txtEl ? txtEl.value.trim() : "";
            if (!msg) return;
            const btn = document.getElementById("send-fb-btn");
            btn.disabled = true; btn.innerText = "جاري الإرسال...";
            try {
                await setDoc(doc(db, 'student_feedbacks', "FB-" + Date.now()), {
                    timestamp: Date.now(),
                    dateStr: new Date().toLocaleDateString("ar-EG"),
                    timeStr: new Date().toLocaleTimeString("ar-EG", { hour: '2-digit', minute: '2-digit' }),
                    studentName: savedUser.name || "طالب",
                    subject: subjectName,
                    score: `${cor}/${tot}`,
                    rating: selectedStars,
                    message: msg
                });
                document.getElementById("feedback-box").innerHTML = `<div class="text-emerald-300 font-black text-xs text-center py-2">✅ شكراً لك! وصلت ملاحظتك للإدارة بنجاح ❤️</div>`;
            } catch (e) {
                btn.disabled = false; btn.innerText = "📩 إرسال الرأي للإدارة";
            }
        };
    </script>
</body>
</html>
