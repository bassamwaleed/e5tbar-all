<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>التفكير الابتكاري | الفرقة الأولى</title>
    <link rel="preconnect" href="https://cdn.tailwindcss.com">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #040711;
            color: #f8fafc;
            height: 100dvh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .ambient-canvas {
            position: fixed; inset: 0; z-index: 0; pointer-events: none;
            background: radial-gradient(circle at 50% 0%, #0f172a 0%, #040711 78%);
        }
        .orb-1 { position: absolute; width: 280px; height: 280px; border-radius: 50%; filter: blur(55px); opacity: 0.4; background: radial-gradient(circle, #06b6d4, #3b82f6); top: -10%; right: -10%; transform: translate3d(0,0,0); }
        .orb-2 { position: absolute; width: 300px; height: 300px; border-radius: 50%; filter: blur(55px); opacity: 0.4; background: radial-gradient(circle, #8b5cf6, #ec4899); bottom: -15%; left: -10%; transform: translate3d(0,0,0); }
        .liquid-glass {
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.82) 0%, rgba(15, 23, 42, 0.62) 100%);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,0.15);
            box-shadow: 0 20px 45px -12px rgba(0, 0, 0, 0.75), inset 0 1px 1px 0 rgba(255, 255, 255, 0.28);
            transform: translate3d(0,0,0);
        }
        .liquid-input { background: rgba(10,15,30,0.85); border: 1px solid rgba(255,255,255,0.16); }
        .setup-box { background: rgba(15,23,42,0.75); border: 1px solid rgba(255,255,255,0.12); transition: 0.2s; }
        .setup-box.active { background: rgba(6,182,212,0.22); border-color: rgba(56,189,248,0.75); box-shadow: 0 0 15px rgba(6,182,212,0.2); }
        .option-btn { background: rgba(255,255,255,0.045); border: 1px solid rgba(255,255,255,0.13); transition: all 0.2s ease; }
        .option-btn:hover:not(:disabled) { background: rgba(255,255,255,0.09); border-color: rgba(56,189,248,0.5); transform: translateX(-3px); }
        .option-btn.correct { background: rgba(16,185,129,0.25) !important; border-color: #10b981 !important; color: #6ee7b7 !important; }
        .option-btn.wrong { background: rgba(244,63,94,0.25) !important; border-color: #f43f5e !important; color: #fda4af !important; }
        .glow-btn { background: linear-gradient(135deg, #06b6d4 0%, #3b82f6 50%, #8b5cf6 100%); box-shadow: 0 10px 25px -5px rgba(59, 130, 246, 0.5); }
    </style>
</head>
<body class="p-3 flex flex-col items-center justify-center">

    <!-- 📢 شريط الإشعارات العاجل (Live Broadcast) -->
    <div id="live-broadcast-bar" class="hidden w-full max-w-2xl mx-auto bg-gradient-to-r from-rose-500/90 via-purple-600/90 to-cyan-500/90 border border-white/25 text-white text-[11px] sm:text-xs font-black py-1.5 px-3.5 text-center z-50 shadow-lg shrink-0 mb-2 rounded-2xl flex items-center justify-between gap-2">
        <span id="live-broadcast-text" class="truncate mx-auto"></span>
        <button onclick="document.getElementById('live-broadcast-bar').classList.add('hidden')" class="text-white/80 hover:text-white text-[10px] font-black px-1.5 rounded bg-black/20 shrink-0">✕</button>
    </div>

    <div class="ambient-canvas"><div class="orb-1"></div><div class="orb-2"></div></div>

    <div class="liquid-glass rounded-3xl p-4 sm:p-6 w-full max-w-2xl max-h-[95dvh] flex flex-col justify-between overflow-hidden relative z-10 flex-1">
        <div class="flex items-center justify-between gap-2 pb-2.5 mb-2 border-b border-white/10 shrink-0">
            <a href="index.html" class="bg-white/5 hover:bg-white/10 border border-white/10 px-3 py-1.5 rounded-xl text-xs font-extrabold transition">→ مواد الفرقة</a>
            <h1 class="text-xs sm:text-base font-black text-cyan-300 truncate">💡 مادة التفكير الابتكاري</h1>
            <button id="reopen-setup" onclick="openSetup()" class="hidden bg-cyan-500/20 border border-cyan-400/40 text-cyan-200 px-3 py-1.5 rounded-xl text-xs font-black hover:bg-cyan-500/30 transition">⚙️ الإعدادات</button>
        </div>

        <div id="setup-screen" class="space-y-3 text-right overflow-y-auto">
            <div class="bg-slate-900/90 border border-cyan-400/35 rounded-2xl p-4 space-y-3">
                <div class="flex items-center justify-between border-b border-white/10 pb-2.5">
                    <div>
                        <h2 class="text-sm font-black text-white">⚙️ إعدادات وتخصيص الاختبار</h2>
                        <p class="text-[10px] text-slate-400">اضبط خياراتك المفضلة قبل الانطلاق</p>
                    </div>
                    <div class="flex items-center gap-2">
                        <span class="text-xs font-black bg-cyan-500/15 text-cyan-300 px-2.5 py-1 rounded-lg border border-cyan-400/30">المتاح: <span id="avail-count">0</span> سؤال</span>
                        <button id="resume-quiz-btn" onclick="resumeQuiz()" class="hidden bg-emerald-500/20 border border-emerald-400/40 text-emerald-300 px-2.5 py-1 rounded-lg text-xs font-black hover:bg-emerald-500/30 transition">
                            ✕ عودة للامتحان
                        </button>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <button type="button" id="mode-mcq" onclick="switchMode('mcq')" class="setup-box active p-2.5 rounded-xl font-black text-xs text-center">📝 اختيار من متعدد</button>
                    <button type="button" id="mode-tf" onclick="switchMode('tf')" class="setup-box p-2.5 rounded-xl font-black text-xs text-center">✅ صح وخطأ</button>
                </div>

                <div class="grid grid-cols-3 gap-2 text-center">
                    <button type="button" id="box-shuffle" onclick="toggleShuffle()" class="setup-box p-2.5 rounded-xl">
                        <div class="text-base">🔢</div>
                        <div class="font-black text-[11px]">الترتيب</div>
                        <div id="txt-shuffle" class="text-[10px] text-cyan-300 font-bold">عادي</div>
                    </button>
                    <button type="button" id="box-qnum" onclick="toggleQNum()" class="setup-box active p-2.5 rounded-xl">
                        <div class="text-base">🆔</div>
                        <div class="font-black text-[11px]">رقم السؤال</div>
                        <div id="txt-qnum" class="text-[10px] text-cyan-300 font-bold">ظاهر</div>
                    </button>
                    <button type="button" id="box-timer" onclick="toggleTimer()" class="setup-box p-2.5 rounded-xl">
                        <div class="text-base">⏱️</div>
                        <div class="font-black text-[11px]">المؤقت</div>
                        <div id="txt-timer" class="text-[10px] text-cyan-300 font-bold">معطل</div>
                    </button>
                </div>

                <div id="timer-row" class="hidden bg-amber-500/10 border border-amber-400/30 rounded-xl p-2.5 items-center justify-between">
                    <span class="text-xs font-bold text-amber-200">⏳ مدة الاختبار بالدقائق:</span>
                    <input type="number" id="timer-mins" min="1" value="15" class="liquid-input w-16 rounded-lg px-2 py-1 text-center text-xs font-black text-amber-300">
                </div>

                <div class="grid grid-cols-2 gap-2.5 bg-white/[0.03] border border-white/10 p-2.5 rounded-xl">
                    <div class="flex items-center justify-between">
                        <span class="text-xs font-bold">من السؤال:</span>
                        <input type="number" id="q-start" min="1" value="1" class="liquid-input w-16 rounded-lg px-2 py-1 text-center text-xs font-black">
                    </div>
                    <div class="flex items-center justify-between">
                        <span class="text-xs font-bold">إلى السؤال:</span>
                        <input type="number" id="q-end" min="1" value="10" class="liquid-input w-16 rounded-lg px-2 py-1 text-center text-xs font-black">
                    </div>
                </div>

                <div class="flex gap-2">
                    <button type="button" onclick="startQuizNow()" class="glow-btn flex-1 py-3 rounded-xl font-black text-xs sm:text-sm text-white transition hover:scale-[1.01]">🚀 تطبيق الإعدادات وبدء الاختبار</button>
                    <button type="button" id="resume-bottom-btn" onclick="resumeQuiz()" class="hidden bg-white/10 hover:bg-white/15 text-white font-bold px-4 py-3 rounded-xl text-xs">استكمال الامتحان الحالي</button>
                </div>
            </div>
        </div>

        <div id="quiz-stage" class="hidden flex-col justify-between overflow-hidden flex-1">
            <div class="bg-white/[0.04] border border-white/10 rounded-xl p-1.5 mb-2 flex items-center justify-between gap-1.5 text-[11px] font-bold shrink-0">
                <div class="flex items-center gap-1 flex-wrap">
                    <button onclick="quickToggleQNum()" id="bar-qnum" class="bg-cyan-500/20 text-cyan-300 px-2.5 py-1 rounded-lg border border-cyan-400/30">🆔 الرقم: ظاهر</button>
                    <button onclick="openSetup()" class="bg-white/5 hover:bg-white/10 text-slate-300 px-2.5 py-1 rounded-lg border border-white/10">🎯 النطاق</button>
                    <button onclick="showBookmarks()" id="top-bookmarks-btn" class="hidden bg-amber-500/20 text-amber-300 px-2.5 py-1 rounded-lg border border-amber-400/30">⭐ المحفوظة (<span id="saved-count-top">0</span>)</button>
                </div>
                <span id="timer-disp" class="hidden bg-amber-500/20 text-amber-300 px-2.5 py-1 rounded-lg border border-amber-400/30 font-mono">⏳ 15:00</span>
            </div>

            <div class="w-full h-1.5 bg-white/10 rounded-full overflow-hidden mb-2.5 shrink-0">
                <div id="progress-fill" class="h-full bg-gradient-to-r from-cyan-400 via-blue-500 to-purple-500 transition-all duration-300" style="width: 0%"></div>
            </div>

            <div class="grid grid-cols-3 gap-2 mb-2.5 text-center text-xs font-black shrink-0">
                <div class="bg-emerald-500/10 border border-emerald-500/25 rounded-xl py-1.5 text-emerald-400">✅ صح: <span id="correct-count">0</span></div>
                <div class="bg-rose-500/10 border border-rose-500/25 rounded-xl py-1.5 text-rose-400">❌ خطأ: <span id="wrong-count">0</span></div>
                <div class="bg-cyan-500/10 border border-cyan-500/25 rounded-xl py-1.5 text-cyan-300">سؤال <span id="q-curr">1</span> من <span id="q-total">0</span></div>
            </div>

            <div id="quiz-container" class="overflow-y-auto py-1 flex-1 flex flex-col justify-between">
            </div>
        </div>
    </div>

    <script>
        if (!sessionStorage.getItem("basmagia_user")) window.location.href = "../index.html";

        const banks = {
            mcq: [
  { "t": "يقصد بالابتكار أنه:", "o": ["مجرد تقليد لأفكار الآخرين", "اكتشاف شيء جديد لم يُعرف من قبل", "تطبيق فكرة جديدة أو تطوير فكرة قائمة بشكل مفيد", "جمع المعلومات من مصادر متعددة"], "a": 2 },
  { "t": "الابتكار يركز على:", "o": ["حفظ المعلومات", "استخدام المعرفة في إنتاج حلول جديدة", "تكرار الأفكار السابقة", "جمع الحقائق العلمية فقط"], "a": 1 },
  { "t": "من سمات العملية الابتكارية:", "o": ["الجمود العقلي", "المرونة والتجريب", "الالتزام بالنمط الواحد", "الرفض لأي تغيير"], "a": 1 },
  { "t": "من أهم خصائص الشخص المبتكر:", "o": ["الخوف من الفشل", "الفضول والرغبة في التعلم المستمر", "الاعتماد على الآخرين", "مقاومة التغيير"], "a": 1 },
  { "t": "يتميز المبتكر بقدرته على:", "o": ["التفكير النمطي", "رؤية العلاقات غير المألوفة بين الأشياء", "اتباع القواعد بدقة دون تجاوز", "تجنب المخاطرة"], "a": 1 },
  { "t": "من السمات الانفعالية للمبتكر:", "o": ["الثقة بالنفس والتحمل الانفعالي", "القلق الزائد", "الانعزال عن الآخرين", "الخضوع للضغوط"], "a": 0 },
  { "t": "المنتج الابتكاري يتميز بأنه:", "o": ["تقليدي ومكرر", "جديد وذو فائدة عملية", "مكلف وغير قابل للتطبيق", "غير واضح الهدف"], "a": 1 },
  { "t": "من الخصائص الأساسية للمنتج الابتكاري:", "o": ["الأصالة والملاءمة", "الغموض", "الصعوبة في الاستخدام", "الانغلاق على فكرة واحدة"], "a": 0 },
  { "t": "يمكن تقييم المنتج الابتكاري من حيث:", "o": ["مدى إشباعه لحاجة أو حله لمشكلة", "مظهره الخارجي فقط", "سهولة تقليده", "مطابقته لما هو موجود"], "a": 0 },
  { "t": "من مهارات التفكير الابتكاري:", "o": ["الحفظ والاسترجاع", "المرونة والطلاقة والأصالة", "اتباع القواعد بدقة", "التركيز على إجابة واحدة"], "a": 1 },
  { "t": "تعد \"الطلاقة\" في التفكير الابتكاري:", "o": ["القدرة على توليد أكبر عدد من الأفكار", "القدرة على الحكم على الأفكار", "الالزام بالفكرة الواحدة", "اكتساب معلومات جديدة فقط"], "a": 0 },
  { "t": "الأصالة تعني:", "o": ["إنتاج أفكار جديدة وغير مألوفة", "إعادة صياغة أفكار الآخرين", "تكرار التجارب السابقة", "تطبيق القواعد بحرفية"], "a": 0 },
  { "t": "يرتبط الجانب الأيمن من المخ بـ:", "o": ["التفكير المنطقي والتحليلي", "الإبداع والتخيل والابتكار", "الحسابات واللغة", "التذكر فقط"], "a": 1 },
  { "t": "أما الجانب الأيسر من المخ فيتعلق بـ:", "o": ["المنطق والتحليل واللغة", "المشاعر والخيال", "الحس الفني", "الاستبصار"], "a": 0 },
  { "t": "التفكير الابتكاري يتطلب:", "o": ["استخدام جانب واحد من المخ", "تكامل عمل نصفي المخ الأيسر والأيمن", "تجاهل الجانب الأيسر", "الاعتماد على الحفظ فقط"], "a": 1 },
  { "t": "العصف الذهني هو:", "o": ["طريقة لجمع المعلومات من الكتب", "أسلوب لتوليد أكبر عدد من الأفكار في زمن قصير دون نقدها", "أسلوب لتقييم الأفكار", "طريقة لتحديد الإجابة الصحيحة"], "a": 1 },
  { "t": "من قواعد جلسة العصف الذهني:", "o": ["التركيز على الكم فقط", "عدم نقد الأفكار أثناء توليدها", "الالتزام بفكرة واحدة", "رفض الأفكار الغريبة"], "a": 1 },
  { "t": "الهدف من العصف الذهني هو:", "o": ["الحفظ والتكرار", "تشجيع الإبداع الجماعي وتعدد وجهات النظر", "التنافس بين المشاركين", "الحكم على الأفكار"], "a": 1 },
  { "t": "العصف الذهني يُقصد به:", "o": ["أسلوب لتوليد أكبر عدد ممكن من الأفكار في وقت قصير دون نقدها", "طريقة لتقييم الأفكار", "أسلوب لإعطاء إجابة صحيحة واحدة", "نقاش جماعي بهدف الإقناع"], "a": 0 },
  { "t": "مؤسس أسلوب العصف الذهني هو:", "o": ["إدوارد دي بونو", "أوزبورن", "جون ديوي", "جيلفورد"], "a": 1 },
  { "t": "يهدف العصف الذهني إلى:", "o": ["تحفيز التفكير الإبداعي لدى الأفراد والجماعات", "الحد من الأفكار الجديدة", "تطبيق الحلول التقليدية", "الوصول إلى فكرة واحدة جاهزة"], "a": 0 },
  { "t": "يندرج العصف الذهني ضمن:", "o": ["استراتيجيات تنمية التفكير الابتكاري", "طرق التعليم التقليدي", "أساليب الحفظ والاسترجاع", "استراتيجيات التقويم"], "a": 0 },
  { "t": "من أهم قواعد العصف الذهني:", "o": ["نقد الأفكار أثناء طرحها", "تأجيل الحكم على الأفكار", "التركيز على الكيف لا الكم", "تجاهل الأفكار الغريبة"], "a": 1 },
  { "t": "مبدأ \"الكم يولد الكيف\" يعني:", "o": ["التركيز على جودة الفكرة فقط", "كلما زاد عدد الأفكار زادت فرصة الوصول لأفكار مبدعة", "تقليل عدد المشاركين", "حذف الأفكار المكررة"], "a": 1 },
  { "t": "من شروط نجاح جلسة العصف الذهني:", "o": ["تهيئة جو من الحرية والانفتاح دون خوف من النقد", "الالتزام بالصمت الكامل", "اقتصار المشاركة على فرد واحد", "تقليل عدد الأفكار"], "a": 0 },
  { "t": "المرحلة الأولى في العصف الذهني هي:", "o": ["تحديد المشكلة أو موضوع الجلسة", "تقييم الحلول", "جمع المعلومات النهائية", "كتابة التقرير"], "a": 0 },
  { "t": "المرحلة الثانية من العصف الذهني تتضمن:", "o": ["إعادة صياغة المشكلة", "حذف الأفكار الضعيفة", "تقويم المشاركين", "مقارنة الإجابات"], "a": 0 },
  { "t": "من مبادئ نجاح جلسة العصف الذهني:", "o": ["تحديد إجابة صحيحة واحدة", "الكم يولد الكيف", "التسرع في الحل", "تكرار الأفكار السابقة"], "a": 1 },
  { "t": "يتم في جلسات العصف الذهني:", "o": ["الاعتماد على التفكير الفردي", "العمل التعاوني بين المشاركين", "تقييم الحلول فوريًا", "تجاهل الأفكار الجديدة"], "a": 1 },
  { "t": "تستخدم الخرائط الذهنية في:", "o": ["تنظيم وترتيب الأفكار بطريقة بصرية", "حفظ النصوص فقط", "كتابة الملاحظات الطويلة", "التفكير الخطي التقليدي"], "a": 0 },
  { "t": "من مميزات استخدام الخرائط الذهنية:", "o": ["تعزيز الذاكرة وتنشيط جانبي المخ معا", "الحد من الإبداع", "التركيز على التفاصيل فقط", "تجاهل الصور والألوان"], "a": 0 },
  { "t": "في الخريطة الذهنية توضع الفكرة الرئيسة في:", "o": ["أسفل الصفحة", "منتصف الصفحة", "الجهة اليمنى", "الهامش"], "a": 1 },
  { "t": "ترى نظرية النظم (Systems Theory) أن الابتكارية تتضمن تأثيرات ترتبط بـ:", "o": ["الجانب الانفعالي فقط", "المجال المعرفي ومهارات الابتكار ذات الدلالة والواقعية", "القدرات الحركية فقط", "التحصيل الدراسي فقط"], "a": 1 },
  { "t": "من متطلبات التفكير وفق نظرية النظم:", "o": ["تجنب المشكلات المعقدة", "التعامل الفعال مع التعقيدات وكسر التفكير العقلي النمطي أثناء حل المشكلة", "الاعتماد على الحفظ والتلقين", "الالتزام بحل واحد للمشكلة"], "a": 1 },

                    </div>
                </div>`;
        }

        window.showMistakes = function() {
            document.getElementById('quiz-container').innerHTML = `
                <div class="space-y-2 text-right overflow-y-auto max-h-64 pr-1">
                    ${wrongList.map(w => `
                        <div class="bg-white/5 border-r-4 border-rose-500 rounded-xl p-3 text-xs space-y-1">
                            <div class="font-black text-white">س${w.id}: ${w.q}</div>
                            <div class="text-rose-400">❌ إجابتك: ${w.sel}</div>
                            <div class="text-emerald-400 font-bold">✅ الصواب: ${w.cor}</div>
                        </div>
                    `).join('')}
                </div>
                <button onclick="startQuizNow()" class="glow-btn w-full py-2.5 rounded-xl font-black text-xs text-white mt-3">🔄 إعادة الاختبار</button>
            `;
        };

        function loadQ() {
            if (isTrialRestricted() && curr >= 10) return finishQuiz(true);
            if (curr >= activeQuestions.length) return finishQuiz(false);

            const q = activeQuestions[curr];
            document.getElementById('q-curr').innerText = curr + 1;
            document.getElementById('progress-fill').style.width = ((curr / activeQuestions.length) * 100) + '%';
            const isBookmarked = bookmarkedList.find(b => b.id === q.id);

            document.getElementById('quiz-container').innerHTML = `
                <div class="flex items-start justify-between gap-2 mb-3 p-3.5 sm:p-4 bg-white/[0.04] border border-white/10 rounded-2xl shadow-inner relative">
                    <div id="question-text" class="text-sm sm:text-base font-extrabold text-right leading-relaxed flex-1">${(showNum ? q.id + '. ' : '') + q.t}</div>
                    <button onclick="toggleBookmark(${q.id})" id="bookmark-btn" title="حفظ السؤال للمراجعة" class="bg-white/5 hover:bg-white/10 border border-white/10 rounded-xl px-2.5 py-1.5 text-sm transition shrink-0 flex items-center gap-1 ${isBookmarked ? 'text-amber-400 opacity-100 border-amber-400/40' : 'text-white opacity-40 hover:opacity-100'}">
                        <span>⭐</span>
                        <span class="text-[10px] font-bold hidden sm:inline">حفظ</span>
                    </button>
                </div>
                <div id="options-container" class="space-y-2"></div>
            `;

            const cont = document.getElementById('options-container');
            const letters = ['أ', 'ب', 'ج', 'د'];
            q.o.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn w-full p-3.5 rounded-xl text-right font-bold text-xs sm:text-sm flex items-center gap-2';
                btn.innerHTML = `<span class="w-6 h-6 rounded-lg bg-white/10 flex items-center justify-center text-[11px] text-cyan-300 shrink-0">${letters[idx] || (idx+1)}</span><span>${opt}</span>`;
                btn.onclick = () => {
                    document.querySelectorAll('.option-btn').forEach(b => b.disabled = true);
                    if (idx === q.a) {
                        btn.classList.add('correct'); correct++; document.getElementById('correct-count').innerText = correct;
                    } else {
                        btn.classList.add('wrong');
                        document.querySelectorAll('.option-btn')[q.a].classList.add('correct');
                        wrong++; document.getElementById('wrong-count').innerText = wrong;
                        wrongList.push({ id: q.id, q: q.t, sel: opt, cor: q.o[q.a] });
                    }
                    setTimeout(() => { curr++; loadQ(); }, 650);
                };
                cont.appendChild(btn);
            });
        }
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD8H-9qYQwmOxrc0KguLaMXC4TnEzkzVAE",
            authDomain: "basmagia-db.firebaseapp.com",
            projectId: "basmagia-db",
            storageBucket: "basmagia-db.firebasestorage.app",
            messagingSenderId: "856738838094",
            appId: "1:856738838094:web:9d2b84baf32567522cf51f"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const savedUser = JSON.parse(sessionStorage.getItem("basmagia_user") || "{}");
        const fp = btoa(unescape(encodeURIComponent("DEV-" + navigator.userAgent.length + "-" + screen.width + "x" + screen.height))).substring(0, 16);

        onSnapshot(doc(db, 'platform_settings', 'broadcast'), (docSnap) => {
            const bar = document.getElementById("live-broadcast-bar");
            const txt = document.getElementById("live-broadcast-text");
            if (docSnap.exists() && docSnap.data().active && docSnap.data().message) {
                if (txt) txt.innerText = "📢 " + docSnap.data().message;
                bar.classList.remove("hidden");
            } else {
                bar.classList.add("hidden");
            }
        });

        const pingOnline = () => {
            setDoc(doc(db, 'online_users', fp), {
                deviceId: fp,
                studentName: savedUser.name || "طالب",
                deviceType: /Mobile|Android|iP(hone|od)/i.test(navigator.userAgent) ? "موبايل 📱" : "كمبيوتر 💻",
                page: "يمتحن: التفكير الابتكاري",
                lastSeen: Date.now()
            }).catch(() => {});
        };
        setTimeout(pingOnline, 1500);
        setInterval(pingOnline, 45000);

        window.submitLeaderboardScore = async function(subject, score, total) {
            try {
                const pct = total > 0 ? Math.round((score / total) * 100) : 0;
                await setDoc(doc(db, 'leaderboard', "LB-" + fp + "-" + subject), {
                    studentName: savedUser.name || "طالب البصمجية",
                    subject: subject,
                    score: score,
                    total: total,
                    pct: pct,
                    timeStr: new Date().toLocaleTimeString("ar-EG", { hour: '2-digit', minute: '2-digit' }),
                    dateStr: new Date().toLocaleDateString("ar-EG"),
                    timestamp: Date.now()
                });
            } catch(e) {}
        };

        let selectedStars = 5;
        window.setRating = function(n) {
            selectedStars = n;
            const spans = document.querySelectorAll("#star-rating span");
            spans.forEach((s, idx) => { s.style.opacity = idx < n ? "1" : "0.25"; });
        };

        window.submitStudentFeedback = async function(subjectName, cor, tot) {
            const txtEl = document.getElementById("feedback-text");
            const msg = txtEl ? txtEl.value.trim() : "";
            if (!msg) return;
            const btn = document.getElementById("send-fb-btn");
            btn.disabled = true;
            btn.innerText = "جاري الإرسال...";
            try {
                await setDoc(doc(db, 'student_feedbacks', "FB-" + Date.now()), {
                    timestamp: Date.now(),
                    dateStr: new Date().toLocaleDateString("ar-EG"),
                    timeStr: new Date().toLocaleTimeString("ar-EG", { hour: '2-digit', minute: '2-digit' }),
                    studentName: savedUser.name || "طالب بالفرقة الأولى",
                    subject: subjectName,
                    score: `${cor}/${tot}`,
                    rating: selectedStars,
                    message: msg
                });
                document.getElementById("feedback-box").innerHTML = `<div class="text-emerald-300 font-black text-xs text-center py-2">✅ شكراً لك! وصلت ملاحظتك للإدارة بنجاح ❤️</div>`;
            } catch (e) {
                btn.disabled = false;
                btn.innerText = "📩 إرسال الرأي للإدارة";
            }
        };
    </script>
</body>
</html>
