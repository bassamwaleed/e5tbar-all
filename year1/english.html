<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>اللغة الإنجليزية | الفرقة الأولى</title>
    <link rel="preconnect" href="https://cdn.tailwindcss.com">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #040711;
            color: #f8fafc;
            height: 100dvh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .ambient-canvas {
            position: fixed; inset: 0; z-index: 0; pointer-events: none;
            background: radial-gradient(circle at 50% 0%, #0f172a 0%, #040711 78%);
        }
        .orb-1 { position: absolute; width: 280px; height: 280px; border-radius: 50%; filter: blur(55px); opacity: 0.4; background: radial-gradient(circle, #06b6d4, #3b82f6); top: -10%; right: -10%; transform: translate3d(0,0,0); }
        .orb-2 { position: absolute; width: 300px; height: 300px; border-radius: 50%; filter: blur(55px); opacity: 0.4; background: radial-gradient(circle, #8b5cf6, #ec4899); bottom: -15%; left: -10%; transform: translate3d(0,0,0); }
        .liquid-glass {
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.82) 0%, rgba(15, 23, 42, 0.62) 100%);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,0.15);
            box-shadow: 0 20px 45px -12px rgba(0, 0, 0, 0.75), inset 0 1px 1px 0 rgba(255, 255, 255, 0.28);
            transform: translate3d(0,0,0);
        }
        .liquid-input { background: rgba(10,15,30,0.85); border: 1px solid rgba(255,255,255,0.16); }
        .setup-box { background: rgba(15,23,42,0.75); border: 1px solid rgba(255,255,255,0.12); transition: 0.2s; }
        .setup-box.active { background: rgba(6,182,212,0.22); border-color: rgba(56,189,248,0.75); box-shadow: 0 0 15px rgba(6,182,212,0.2); }
        .option-btn { background: rgba(255,255,255,0.045); border: 1px solid rgba(255,255,255,0.13); transition: all 0.2s ease; }
        .option-btn:hover:not(:disabled) { background: rgba(255,255,255,0.09); border-color: rgba(56,189,248,0.5); transform: translateX(-3px); }
        .option-btn.correct { background: rgba(16,185,129,0.25) !important; border-color: #10b981 !important; color: #6ee7b7 !important; }
        .option-btn.wrong { background: rgba(244,63,94,0.25) !important; border-color: #f43f5e !important; color: #fda4af !important; }
        .glow-btn { background: linear-gradient(135deg, #06b6d4 0%, #3b82f6 50%, #8b5cf6 100%); box-shadow: 0 10px 25px -5px rgba(59, 130, 246, 0.5); }
    </style>
</head>
<body class="p-3">
    <div class="ambient-canvas"><div class="orb-1"></div><div class="orb-2"></div></div>

    <div class="liquid-glass rounded-3xl p-4 sm:p-6 w-full max-w-2xl max-h-[96dvh] flex flex-col justify-between overflow-hidden relative z-10">
        <div class="flex items-center justify-between gap-2 pb-2.5 mb-2 border-b border-white/10 shrink-0">
            <a href="index.html" class="bg-white/5 hover:bg-white/10 border border-white/10 px-3 py-1.5 rounded-xl text-xs font-extrabold transition">→ مواد الفرقة</a>
            <h1 class="text-xs sm:text-base font-black text-cyan-300 truncate">🔤 مادة اللغة الإنجليزية</h1>
            <button id="reopen-setup" onclick="openSetup()" class="hidden bg-cyan-500/20 border border-cyan-400/40 text-cyan-200 px-3 py-1.5 rounded-xl text-xs font-black hover:bg-cyan-500/30 transition">⚙️ الإعدادات</button>
        </div>

        <div id="setup-screen" class="space-y-3 text-right overflow-y-auto">
            <div class="bg-slate-900/90 border border-cyan-400/35 rounded-2xl p-4 space-y-3">
                <div class="flex items-center justify-between border-b border-white/10 pb-2.5">
                    <div>
                        <h2 class="text-sm font-black text-white">⚙️ إعدادات وتخصيص الاختبار</h2>
                        <p class="text-[10px] text-slate-400">اضبط خياراتك المفضلة قبل الانطلاق</p>
                    </div>
                    <div class="flex items-center gap-2">
                        <span class="text-xs font-black bg-cyan-500/15 text-cyan-300 px-2.5 py-1 rounded-lg border border-cyan-400/30">المتاح: <span id="avail-count">0</span> سؤال</span>
                        <button id="resume-quiz-btn" onclick="resumeQuiz()" class="hidden bg-emerald-500/20 border border-emerald-400/40 text-emerald-300 px-2.5 py-1 rounded-lg text-xs font-black hover:bg-emerald-500/30 transition">
                            ✕ عودة للامتحان
                        </button>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <button type="button" id="mode-mcq" onclick="switchMode('mcq')" class="setup-box active p-2.5 rounded-xl font-black text-xs text-center">📝 اختيار من متعدد</button>
                    <button type="button" id="mode-tf" onclick="switchMode('tf')" class="setup-box p-2.5 rounded-xl font-black text-xs text-center">✅ صح وخطأ</button>
                </div>

                <div class="grid grid-cols-3 gap-2 text-center">
                    <button type="button" id="box-shuffle" onclick="toggleShuffle()" class="setup-box p-2.5 rounded-xl">
                        <div class="text-base">🔢</div>
                        <div class="font-black text-[11px]">الترتيب</div>
                        <div id="txt-shuffle" class="text-[10px] text-cyan-300 font-bold">عادي</div>
                    </button>
                    <button type="button" id="box-qnum" onclick="toggleQNum()" class="setup-box active p-2.5 rounded-xl">
                        <div class="text-base">🆔</div>
                        <div class="font-black text-[11px]">رقم السؤال</div>
                        <div id="txt-qnum" class="text-[10px] text-cyan-300 font-bold">ظاهر</div>
                    </button>
                    <button type="button" id="box-timer" onclick="toggleTimer()" class="setup-box p-2.5 rounded-xl">
                        <div class="text-base">⏱️</div>
                        <div class="font-black text-[11px]">المؤقت</div>
                        <div id="txt-timer" class="text-[10px] text-cyan-300 font-bold">معطل</div>
                    </button>
                </div>

                <div id="timer-row" class="hidden bg-amber-500/10 border border-amber-400/30 rounded-xl p-2.5 items-center justify-between">
                    <span class="text-xs font-bold text-amber-200">⏳ مدة الاختبار بالدقائق:</span>
                    <input type="number" id="timer-mins" min="1" value="15" class="liquid-input w-16 rounded-lg px-2 py-1 text-center text-xs font-black text-amber-300">
                </div>

                <div class="grid grid-cols-2 gap-2.5 bg-white/[0.03] border border-white/10 p-2.5 rounded-xl">
                    <div class="flex items-center justify-between">
                        <span class="text-xs font-bold">من السؤال:</span>
                        <input type="number" id="q-start" min="1" value="1" class="liquid-input w-16 rounded-lg px-2 py-1 text-center text-xs font-black">
                    </div>
                    <div class="flex items-center justify-between">
                        <span class="text-xs font-bold">إلى السؤال:</span>
                        <input type="number" id="q-end" min="1" value="10" class="liquid-input w-16 rounded-lg px-2 py-1 text-center text-xs font-black">
                    </div>
                </div>

                <div class="flex gap-2">
                    <button type="button" onclick="startQuizNow()" class="glow-btn flex-1 py-3 rounded-xl font-black text-xs sm:text-sm text-white transition hover:scale-[1.01]">🚀 تطبيق الإعدادات وبدء الاختبار</button>
                    <button type="button" id="resume-bottom-btn" onclick="resumeQuiz()" class="hidden bg-white/10 hover:bg-white/15 text-white font-bold px-4 py-3 rounded-xl text-xs">استكمال الامتحان الحالي</button>
                </div>
            </div>
        </div>

        <div id="quiz-stage" class="hidden flex-col justify-between overflow-hidden flex-1">
            <div class="bg-white/[0.04] border border-white/10 rounded-xl p-1.5 mb-2 flex items-center justify-between gap-1.5 text-[11px] font-bold shrink-0">
                <div class="flex items-center gap-1">
                    <button onclick="quickToggleQNum()" id="bar-qnum" class="bg-cyan-500/20 text-cyan-300 px-2.5 py-1 rounded-lg border border-cyan-400/30">🆔 الرقم: ظاهر</button>
                    <button onclick="openSetup()" class="bg-white/5 hover:bg-white/10 text-slate-300 px-2.5 py-1 rounded-lg border border-white/10">🎯 تغيير النطاق</button>
                </div>
                <span id="timer-disp" class="hidden bg-amber-500/20 text-amber-300 px-2.5 py-1 rounded-lg border border-amber-400/30 font-mono">⏳ 15:00</span>
            </div>

            <div class="w-full h-1.5 bg-white/10 rounded-full overflow-hidden mb-2.5 shrink-0">
                <div id="progress-fill" class="h-full bg-gradient-to-r from-cyan-400 via-blue-500 to-purple-500 transition-all duration-300" style="width: 0%"></div>
            </div>

            <div class="grid grid-cols-3 gap-2 mb-2.5 text-center text-xs font-black shrink-0">
                <div class="bg-emerald-500/10 border border-emerald-500/25 rounded-xl py-1.5 text-emerald-400">✅ صح: <span id="correct-count">0</span></div>
                <div class="bg-rose-500/10 border border-rose-500/25 rounded-xl py-1.5 text-rose-400">❌ خطأ: <span id="wrong-count">0</span></div>
                <div class="bg-cyan-500/10 border border-cyan-500/25 rounded-xl py-1.5 text-cyan-300">سؤال <span id="q-curr">1</span> من <span id="q-total">0</span></div>
            </div>

            <div id="quiz-container" class="overflow-y-auto py-1 flex-1 flex flex-col justify-between">
                <div id="question-text" class="text-sm sm:text-lg font-extrabold text-center mb-3 p-4 bg-white/[0.04] border border-white/10 rounded-2xl leading-relaxed shadow-inner"></div>
                <div id="options-container" class="space-y-2"></div>
            </div>
        </div>
    </div>

    <script>
        if (!sessionStorage.getItem("basmagia_user")) window.location.href = "../index.html";

        const banks = {
            mcq: [
                { "t": "عند تصميم منتج إلكتروني، فإن الميزة الأكثر تأثيرًا على سرعة انتشاره هي:", "o": ["الشكل المادي", "إمكانية التوزيع الرقمي", "تكلفة الإنتاج", "حجم المخزون"], "a": 1 },
                { "t": "في التسعير الإلكتروني، انخفاض الأسعار غالبًا يرجع إلى:", "o": ["زيادة الضرائب", "تقليل الوسطاء", "ارتفاع الطلب", "ثبات التكاليف"], "a": 1 },
                { "t": "أهم عنصر في نجاح E-CRM:", "o": ["المخزون", "السعر", "الموقع فقط", "المعرفة"], "a": 3 },
                { "t": "أي مما يلي يمثل عنصر Place ؟", "o": ["السعر", "التوزيع", "المنتج", "الإعلان"], "a": 1 },
                { "t": "أي مما يلي يمثل تسويق G2C ؟", "o": ["شركة لعميل", "حكومة لمستهلك", "عميل لعميل", "شركة لشركة"], "a": 1 },
                { "t": "أي مما يلي يمثل عنصر Promotion ؟", "o": ["السعر", "التوزيع", "الترويج", "المنتج"], "a": 2 },
                { "t": "إذا كان معدل الارتداد (Bounce Rate) مرتفعًا جدًا، فهذا يعني:", "o": ["نجاح الموقع", "بقاء المستخدمين لفترة طويلة", "مغادرة المستخدمين بسرعة دون تفاعل", "زيادة المبيعات"], "a": 2 }
            ],
            tf: [
                { "t": "يساهم التسويق الإلكتروني في تقليص المسافة والوسطاء بين البائع والمشتري.", "o": ["صواب", "خطأ"], "a": 0 },
                { "t": "التسعير الإلكتروني يتميز بالمرونة والقدرة على التحديث اللحظي.", "o": ["صواب", "خطأ"], "a": 0 },
                { "t": "سرعة استجابة الموقع الإلكتروني وأمان البيانات من أهم محددات نجاح E-CRM.", "o": ["صواب", "خطأ"], "a": 0 },
                { "t": "معدل الارتداد المرتفع (Bounce Rate) يدل على بقاء المستخدمين لفترة طويلة وتفاعلهم مع الموقع.", "o": ["صواب", "خطأ"], "a": 1 }
            ]
        };

        let currentMode = 'mcq', rawQuestions = [], activeQuestions = [], wrongList = [], curr = 0, correct = 0, wrong = 0;
        let isShuffle = false, showNum = true, isTimer = false, timerInt = null, timeLeft = 0, isQuizRunning = false;

        function switchMode(m) {
            currentMode = m;
            document.getElementById('mode-mcq').classList.toggle('active', m === 'mcq');
            document.getElementById('mode-tf').classList.toggle('active', m === 'tf');
            rawQuestions = banks[m].map((q, i) => ({...q, id: i + 1}));
            document.getElementById('avail-count').innerText = rawQuestions.length;
            document.getElementById('q-start').value = 1;
            document.getElementById('q-end').value = rawQuestions.length;
        }

        const urlParams = new URLSearchParams(window.location.search);
        switchMode(urlParams.get('mode') === 'tf' ? 'tf' : 'mcq');

        function toggleShuffle() { isShuffle = !isShuffle; document.getElementById('box-shuffle').classList.toggle('active', isShuffle); document.getElementById('txt-shuffle').innerText = isShuffle ? 'عشوائي' : 'عادي'; }
        function toggleQNum() {
            showNum = !showNum;
            document.getElementById('box-qnum').classList.toggle('active', showNum);
            document.getElementById('txt-qnum').innerText = showNum ? 'ظاهر' : 'مخفي';
            document.getElementById('bar-qnum').innerText = showNum ? '🆔 الرقم: ظاهر' : '🆔 الرقم: مخفي';
        }
        function quickToggleQNum() {
            toggleQNum();
            if (isQuizRunning && curr < activeQuestions.length) {
                const q = activeQuestions[curr];
                const qEl = document.getElementById('question-text');
                if (qEl) qEl.innerText = (showNum ? q.id + '. ' : '') + q.t;
            }
        }
        function toggleTimer() { isTimer = !isTimer; document.getElementById('box-timer').classList.toggle('active', isTimer); document.getElementById('txt-timer').innerText = isTimer ? 'مفعل' : 'معطل'; document.getElementById('timer-row').classList.toggle('hidden', !isTimer); document.getElementById('timer-row').classList.toggle('flex', isTimer); }

        function openSetup() {
            document.getElementById('setup-screen').classList.remove('hidden');
            document.getElementById('quiz-stage').classList.add('hidden');
            document.getElementById('quiz-stage').classList.remove('flex');
            document.getElementById('reopen-setup').classList.add('hidden');
            if (isQuizRunning && curr < activeQuestions.length) {
                document.getElementById('resume-quiz-btn').classList.remove('hidden');
                document.getElementById('resume-bottom-btn').classList.remove('hidden');
            }
        }

        function resumeQuiz() {
            document.getElementById('setup-screen').classList.add('hidden');
            document.getElementById('quiz-stage').classList.remove('hidden');
            document.getElementById('quiz-stage').classList.add('flex');
            document.getElementById('reopen-setup').classList.remove('hidden');
            if (curr < activeQuestions.length) {
                const q = activeQuestions[curr];
                const qEl = document.getElementById('question-text');
                if (qEl) qEl.innerText = (showNum ? q.id + '. ' : '') + q.t;
            }
        }

        function startQuizNow() {
            let s = parseInt(document.getElementById('q-start').value) || 1;
            let e = parseInt(document.getElementById('q-end').value) || rawQuestions.length;
            if (s < 1) s = 1; if (e > rawQuestions.length) e = rawQuestions.length; if (s > e) s = e;
            activeQuestions = rawQuestions.slice(s - 1, e);
            if (isShuffle) activeQuestions.sort(() => Math.random() - 0.5);
            curr = 0; correct = 0; wrong = 0; wrongList = []; isQuizRunning = true;
            document.getElementById('correct-count').innerText = 0;
            document.getElementById('wrong-count').innerText = 0;
            document.getElementById('q-total').innerText = activeQuestions.length;
            document.getElementById('setup-screen').classList.add('hidden');
            document.getElementById('quiz-stage').classList.remove('hidden');
            document.getElementById('quiz-stage').classList.add('flex');
            document.getElementById('reopen-setup').classList.remove('hidden');
            document.getElementById('quiz-container').innerHTML = '<div id="question-text" class="text-sm sm:text-lg font-extrabold text-center mb-3 p-4 bg-white/[0.04] border border-white/10 rounded-2xl leading-relaxed shadow-inner"></div><div id="options-container" class="space-y-2"></div>';
            if (timerInt) clearInterval(timerInt);
            const tDisp = document.getElementById('timer-disp');
            if (isTimer) {
                timeLeft = (parseInt(document.getElementById('timer-mins').value) || 15) * 60;
                tDisp.classList.remove('hidden');
                timerInt = setInterval(() => {
                    timeLeft--;
                    tDisp.innerText = '⏳ ' + Math.floor(timeLeft/60).toString().padStart(2,'0') + ':' + (timeLeft%60).toString().padStart(2,'0');
                    if (timeLeft <= 0) { clearInterval(timerInt); finishQuiz(); }
                }, 1000);
            } else { tDisp.classList.add('hidden'); }
            loadQ();
        }

        function finishQuiz() {
            if (timerInt) clearInterval(timerInt);
            isQuizRunning = false;
            document.getElementById('progress-fill').style.width = '100%';
            document.getElementById('quiz-container').innerHTML = `
                <div class="text-center py-2 space-y-2.5">
                    <div class="text-3xl">🏆</div>
                    <h3 class="text-lg font-black text-white">انتهى الاختبار بنجاح!</h3>
                    <p class="text-xs text-slate-300">نتيجتك: <b class="text-emerald-400">${correct}</b> صح من <b class="text-cyan-300">${activeQuestions.length}</b></p>
                    <div class="flex flex-wrap gap-2 justify-center">
                        <button onclick="startQuizNow()" class="glow-btn text-white font-black px-4 py-2 rounded-xl text-xs">🔄 إعادة الاختبار</button>
                        ${wrongList.length > 0 ? `<button onclick="showMistakes()" class="bg-rose-500/20 border border-rose-400/40 text-rose-300 font-black px-3.5 py-2 rounded-xl text-xs">📋 مراجعة الأخطاء (${wrongList.length})</button>` : ''}
                        <button onclick="openSetup()" class="bg-white/10 text-white font-bold px-3.5 py-2 rounded-xl text-xs">⚙️ الإعدادات</button>
                    </div>

                    <div id="feedback-box" class="bg-slate-900/90 border border-cyan-400/30 rounded-2xl p-3 text-right space-y-2 mt-2">
                        <div class="flex items-center justify-between">
                            <span class="text-xs font-black text-cyan-300">💬 شاركنا رأيك أو ملاحظاتك في الامتحان:</span>
                            <div class="flex gap-1 text-sm cursor-pointer" id="star-rating">
                                <span onclick="setRating(1)">⭐</span><span onclick="setRating(2)">⭐</span><span onclick="setRating(3)">⭐</span><span onclick="setRating(4)">⭐</span><span onclick="setRating(5)">⭐</span>
                            </div>
                        </div>
                        <textarea id="feedback-text" rows="2" placeholder="اكتب رأيك في الأسئلة أو أي اقتراح أو ملاحظة للإدارة..." class="liquid-input w-full rounded-xl p-2 text-xs text-white outline-none resize-none"></textarea>
                        <button onclick="submitStudentFeedback('اللغة الإنجليزية', ${correct}, ${activeQuestions.length})" id="send-fb-btn" class="w-full py-2 rounded-xl font-black text-xs bg-emerald-500 hover:bg-emerald-400 text-slate-950 transition">
                            📩 إرسال الرأي للإدارة
                        </button>
                    </div>
                </div>`;
        }

        window.showMistakes = function() {
            document.getElementById('quiz-container').innerHTML = `
                <div class="space-y-2 text-right overflow-y-auto max-h-64 pr-1">
                    ${wrongList.map(w => `
                        <div class="bg-white/5 border-r-4 border-rose-500 rounded-xl p-3 text-xs space-y-1">
                            <div class="font-black text-white">س${w.id}: ${w.q}</div>
                            <div class="text-rose-400">❌ إجابتك: ${w.sel}</div>
                            <div class="text-emerald-400 font-bold">✅ الصواب: ${w.cor}</div>
                        </div>
                    `).join('')}
                </div>
                <button onclick="startQuizNow()" class="glow-btn w-full py-2.5 rounded-xl font-black text-xs text-white mt-3">🔄 إعادة الاختبار</button>
            `;
        };

        function loadQ() {
            if (curr >= activeQuestions.length) return finishQuiz();
            const q = activeQuestions[curr];
            document.getElementById('q-curr').innerText = curr + 1;
            document.getElementById('progress-fill').style.width = ((curr / activeQuestions.length) * 100) + '%';
            document.getElementById('question-text').innerText = (showNum ? q.id + '. ' : '') + q.t;
            const cont = document.getElementById('options-container');
            cont.innerHTML = '';
            const letters = ['أ', 'ب', 'ج', 'د'];
            q.o.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn w-full p-3.5 rounded-xl text-right font-bold text-xs sm:text-sm flex items-center gap-2';
                btn.innerHTML = `<span class="w-6 h-6 rounded-lg bg-white/10 flex items-center justify-center text-[11px] text-cyan-300 shrink-0">${letters[idx] || (idx+1)}</span><span>${opt}</span>`;
                btn.onclick = () => {
                    document.querySelectorAll('.option-btn').forEach(b => b.disabled = true);
                    if (idx === q.a) {
                        btn.classList.add('correct'); correct++; document.getElementById('correct-count').innerText = correct;
                    } else {
                        btn.classList.add('wrong');
                        document.querySelectorAll('.option-btn')[q.a].classList.add('correct');
                        wrong++; document.getElementById('wrong-count').innerText = wrong;
                        wrongList.push({ id: q.id, q: q.t, sel: opt, cor: q.o[q.a] });
                    }
                    setTimeout(() => { curr++; loadQ(); }, 650);
                };
                cont.appendChild(btn);
            });
        }
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD8H-9qYQwmOxrc0KguLaMXC4TnEzkzVAE",
            authDomain: "basmagia-db.firebaseapp.com",
            projectId: "basmagia-db",
            storageBucket: "basmagia-db.firebasestorage.app",
            messagingSenderId: "856738838094",
            appId: "1:856738838094:web:9d2b84baf32567522cf51f"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const savedUser = JSON.parse(sessionStorage.getItem("basmagia_user") || "{}");
        const fp = btoa(unescape(encodeURIComponent("DEV-" + navigator.userAgent.length + "-" + screen.width + "x" + screen.height))).substring(0, 16);

        const pingOnline = () => {
            setDoc(doc(db, 'online_users', fp), {
                deviceId: fp,
                studentName: savedUser.name || "طالب",
                deviceType: /Mobile|Android|iP(hone|od)/i.test(navigator.userAgent) ? "موبايل 📱" : "كمبيوتر 💻",
                page: "يمتحن: اللغة الإنجليزية",
                lastSeen: Date.now()
            }).catch(() => {});
        };
        setTimeout(pingOnline, 1500);
        setInterval(pingOnline, 45000);

        let selectedStars = 5;
        window.setRating = function(n) {
            selectedStars = n;
            const spans = document.querySelectorAll("#star-rating span");
            spans.forEach((s, idx) => { s.style.opacity = idx < n ? "1" : "0.25"; });
        };

        window.submitStudentFeedback = async function(subjectName, cor, tot) {
            const txtEl = document.getElementById("feedback-text");
            const msg = txtEl ? txtEl.value.trim() : "";
            if (!msg) return;
            const btn = document.getElementById("send-fb-btn");
            btn.disabled = true;
            btn.innerText = "جاري الإرسال...";
            try {
                await setDoc(doc(db, 'student_feedbacks', "FB-" + Date.now()), {
                    timestamp: Date.now(),
                    dateStr: new Date().toLocaleDateString("ar-EG"),
                    timeStr: new Date().toLocaleTimeString("ar-EG", { hour: '2-digit', minute: '2-digit' }),
                    studentName: savedUser.name || "طالب بالفرقة الأولى",
                    subject: subjectName,
                    score: `${cor}/${tot}`,
                    rating: selectedStars,
                    message: msg
                });
                document.getElementById("feedback-box").innerHTML = `<div class="text-emerald-300 font-black text-xs text-center py-2">✅ شكراً لك! وصلت ملاحظتك للإدارة بنجاح ❤️</div>`;
            } catch (e) {
                btn.disabled = false;
                btn.innerText = "📩 إرسال الرأي للإدارة";
            }
        };
    </script>
</body>
