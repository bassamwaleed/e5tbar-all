<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>المادة الخامسة | الفرقة الأولى</title>
    <link rel="preconnect" href="https://cdn.tailwindcss.com">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #040711;
            color: #f8fafc;
            height: 100dvh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .ambient-canvas {
            position: fixed; inset: 0; z-index: 0; pointer-events: none;
            background: radial-gradient(circle at 50% 0%, #0f172a 0%, #040711 78%);
        }
        .orb-1 { position: absolute; width: 280px; height: 280px; border-radius: 50%; filter: blur(55px); opacity: 0.4; background: radial-gradient(circle, #06b6d4, #3b82f6); top: -10%; right: -10%; transform: translate3d(0,0,0); }
        .orb-2 { position: absolute; width: 300px; height: 300px; border-radius: 50%; filter: blur(55px); opacity: 0.4; background: radial-gradient(circle, #8b5cf6, #ec4899); bottom: -15%; left: -10%; transform: translate3d(0,0,0); }
        .liquid-glass {
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.82) 0%, rgba(15, 23, 42, 0.62) 100%);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,0.15);
            box-shadow: 0 20px 45px -12px rgba(0, 0, 0, 0.75), inset 0 1px 1px 0 rgba(255, 255, 255, 0.28);
            transform: translate3d(0,0,0);
        }
        .liquid-input { background: rgba(10,15,30,0.85); border: 1px solid rgba(255,255,255,0.16); }
        .setup-box { background: rgba(15,23,42,0.75); border: 1px solid rgba(255,255,255,0.12); transition: 0.2s; }
        .setup-box.active { background: rgba(6,182,212,0.22); border-color: rgba(56,189,248,0.75); box-shadow: 0 0 15px rgba(6,182,212,0.2); }
        .option-btn { background: rgba(255,255,255,0.045); border: 1px solid rgba(255,255,255,0.13); transition: all 0.2s ease; }
        .option-btn:hover:not(:disabled) { background: rgba(255,255,255,0.09); border-color: rgba(56,189,248,0.5); transform: translateX(-3px); }
        .option-btn.correct { background: rgba(16,185,129,0.25) !important; border-color: #10b981 !important; color: #6ee7b7 !important; }
        .option-btn.wrong { background: rgba(244,63,94,0.25) !important; border-color: #f43f5e !important; color: #fda4af !important; }
        .glow-btn { background: linear-gradient(135deg, #06b6d4 0%, #3b82f6 50%, #8b5cf6 100%); box-shadow: 0 10px 25px -5px rgba(59, 130, 246, 0.5); }
    </style>
</head>
<body class="p-3">
    <div class="ambient-canvas"><div class="orb-1"></div><div class="orb-2"></div></div>

    <div class="liquid-glass rounded-3xl p-4 sm:p-6 w-full max-w-2xl max-h-[96dvh] flex flex-col justify-between overflow-hidden relative z-10">
        <div class="flex items-center justify-between gap-2 pb-2.5 mb-2 border-b border-white/10 shrink-0">
            <a href="index.html" class="bg-white/5 hover:bg-white/10 border border-white/10 px-3 py-1.5 rounded-xl text-xs font-extrabold transition">→ مواد الفرقة</a>
            <h1 class="text-xs sm:text-base font-black text-cyan-300 truncate">📋 المادة الخامسة (مبادئ الإدارة)</h1>
            <button id="reopen-setup" onclick="openSetup()" class="hidden bg-cyan-500/20 border border-cyan-400/40 text-cyan-200 px-3 py-1.5 rounded-xl text-xs font-black hover:bg-cyan-500/30 transition">⚙️ الإعدادات</button>
        </div>

        <div id="setup-screen" class="space-y-3 text-right overflow-y-auto">
            <div class="bg-slate-900/90 border border-cyan-400/35 rounded-2xl p-4 space-y-3">
                <div class="flex items-center justify-between border-b border-white/10 pb-2.5">
                    <div>
                        <h2 class="text-sm font-black text-white">⚙️ إعدادات وتخصيص الاختبار</h2>
                        <p class="text-[10px] text-slate-400">اضبط خياراتك المفضلة قبل الانطلاق</p>
                    </div>
                    <div class="flex items-center gap-2">
                        <span class="text-xs font-black bg-cyan-500/15 text-cyan-300 px-2.5 py-1 rounded-lg border border-cyan-400/30">المتاح: <span id="avail-count">0</span> سؤال</span>
                        <button id="resume-quiz-btn" onclick="resumeQuiz()" class="hidden bg-emerald-500/20 border border-emerald-400/40 text-emerald-300 px-2.5 py-1 rounded-lg text-xs font-black hover:bg-emerald-500/30 transition">
                            ✕ عودة للامتحان
                        </button>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <button type="button" id="mode-mcq" onclick="switchMode('mcq')" class="setup-box active p-2.5 rounded-xl font-black text-xs text-center">📝 اختيار من متعدد</button>
                    <button type="button" id="mode-tf" onclick="switchMode('tf')" class="setup-box p-2.5 rounded-xl font-black text-xs text-center">✅ صح وخطأ</button>
                </div>

                <div class="grid grid-cols-3 gap-2 text-center">
                    <button type="button" id="box-shuffle" onclick="toggleShuffle()" class="setup-box p-2.5 rounded-xl">
                        <div class="text-base">🔢</div>
                        <div class="font-black text-[11px]">الترتيب</div>
                        <div id="txt-shuffle" class="text-[10px] text-cyan-300 font-bold">عادي</div>
                    </button>
                    <button type="button" id="box-qnum" onclick="toggleQNum()" class="setup-box active p-2.5 rounded-xl">
                        <div class="text-base">🆔</div>
                        <div class="font-black text-[11px]">رقم السؤال</div>
                        <div id="txt-qnum" class="text-[10px] text-cyan-300 font-bold">ظاهر</div>
                    </button>
                    <button type="button" id="box-timer" onclick="toggleTimer()" class="setup-box p-2.5 rounded-xl">
                        <div class="text-base">⏱️</div>
                        <div class="font-black text-[11px]">المؤقت</div>
                        <div id="txt-timer" class="text-[10px] text-cyan-300 font-bold">معطل</div>
                    </button>
                </div>

                <div id="timer-row" class="hidden bg-amber-500/10 border border-amber-400/30 rounded-xl p-2.5 items-center justify-between">
                    <span class="text-xs font-bold text-amber-200">⏳ مدة الاختبار بالدقائق:</span>
                    <input type="number" id="timer-mins" min="1" value="15" class="liquid-input w-16 rounded-lg px-2 py-1 text-center text-xs font-black text-amber-300">
                </div>

                <div class="grid grid-cols-2 gap-2.5 bg-white/[0.03] border border-white/10 p-2.5 rounded-xl">
                    <div class="flex items-center justify-between">
                        <span class="text-xs font-bold">من السؤال:</span>
                        <input type="number" id="q-start" min="1" value="1" class="liquid-input w-16 rounded-lg px-2 py-1 text-center text-xs font-black">
                    </div>
                    <div class="flex items-center justify-between">
                        <span class="text-xs font-bold">إلى السؤال:</span>
                        <input type="number" id="q-end" min="1" value="10" class="liquid-input w-16 rounded-lg px-2 py-1 text-center text-xs font-black">
                    </div>
                </div>

                <div class="flex gap-2">
                    <button type="button" onclick="startQuizNow()" class="glow-btn flex-1 py-3 rounded-xl font-black text-xs sm:text-sm text-white transition hover:scale-[1.01]">🚀 تطبيق الإعدادات وبدء الاختبار</button>
                    <button type="button" id="resume-bottom-btn" onclick="resumeQuiz()" class="hidden bg-white/10 hover:bg-white/15 text-white font-bold px-4 py-3 rounded-xl text-xs">استكمال الامتحان الحالي</button>
                </div>
            </div>
        </div>

        <div id="quiz-stage" class="hidden flex-col justify-between overflow-hidden flex-1">
            <div class="bg-white/[0.04] border border-white/10 rounded-xl p-1.5 mb-2 flex items-center justify-between gap-1.5 text-[11px] font-bold shrink-0">
                <div class="flex items-center gap-1">
                    <button onclick="quickToggleQNum()" id="bar-qnum" class="bg-cyan-500/20 text-cyan-300 px-2.5 py-1 rounded-lg border border-cyan-400/30">🆔 الرقم: ظاهر</button>
                    <button onclick="openSetup()" class="bg-white/5 hover:bg-white/10 text-slate-300 px-2.5 py-1 rounded-lg border border-white/10">🎯 تغيير النطاق</button>
                </div>
                <span id="timer-disp" class="hidden bg-amber-500/20 text-amber-300 px-2.5 py-1 rounded-lg border border-amber-400/30 font-mono">⏳ 15:00</span>
            </div>

            <div class="w-full h-1.5 bg-white/10 rounded-full overflow-hidden mb-2.5 shrink-0">
                <div id="progress-fill" class="h-full bg-gradient-to-r from-cyan-400 via-blue-500 to-purple-500 transition-all duration-300" style="width: 0%"></div>
            </div>

            <div class="grid grid-cols-3 gap-2 mb-2.5 text-center text-xs font-black shrink-0">
                <div class="bg-emerald-500/10 border border-emerald-500/25 rounded-xl py-1.5 text-emerald-400">✅ صح: <span id="correct-count">0</span></div>
                <div class="bg-rose-500/10 border border-rose-500/25 rounded-xl py-1.5 text-rose-400">❌ خطأ: <span id="wrong-count">0</span></div>
                <div class="bg-cyan-500/10 border border-cyan-500/25 rounded-xl py-1.5 text-cyan-300">سؤال <span id="q-curr">1</span> من <span id="q-total">0</span></div>
            </div>

            <div id="quiz-container" class="overflow-y-auto py-1 flex-1 flex flex-col justify-between">
                <div id="question-text" class="text-sm sm:text-lg font-extrabold text-center mb-3 p-4 bg-white/[0.04] border border-white/10 rounded-2xl leading-relaxed shadow-inner"></div>
                <div id="options-container" class="space-y-2"></div>
            </div>
        </div>
    </div>

    <script>
        if (!sessionStorage.getItem("basmagia_user")) window.location.href = "../index.html";

        const banks = {
            mcq: [
               
  { "t": "يُعرف الاتصال بأنه:", "o": ["نقل بيانات", "تبادل معلومات وأفكار بين طرفين", "عملية استماع فقط", "تحويل الرسائل إلى رموز"], "a": 1 },
  { "t": "من خصائص الاتصال:", "o": ["يحدث بدون أطراف", "عملية ديناميكية مستمرة", "لا يحتاج لتغذية راجعة", "يعتمد فقط على اللغة"], "a": 1 },
  { "t": "أي مما يلي يُعد من عناصر الاتصال؟", "o": ["الكتابة والقراءة", "المرسل والرسالة والوسيلة", "الذاكرة والانتباه", "الفهم والتفسير"], "a": 1 },
  { "t": "التغذية الراجعة تعني:", "o": ["إعادة إرسال الرسالة نفسها", "الرد أو التفاعل من المستقبل", "وسيلة الاتصال المختارة", "تشويش الرسالة"], "a": 1 },
  { "t": "من خصائص الاتصال الرقمي:", "o": ["بطيء في نقل المعلومات", "يتطلب مواجهة مباشرة", "يعتمد على التكنولوجيا", "يخلو من أي تفاعلية"], "a": 2 },
  { "t": "أحد أمثلة الاتصال الرقمي:", "o": ["الحوار وجها لوجه", "الرسائل النصية عبر الهاتف", "الخطبة المباشرة", "المناقشة الصفية"], "a": 1 },
  { "t": "تعتبر لغة الإشارة إحدى وسائل الاتصال لـ:", "o": ["ذوي الإعاقة البصرية", "ذوي الإعاقة السمعية", "ذوي صعوبات التعلم", "الإعاقة الحركية"], "a": 1 },
  { "t": "من وسائل الاتصال لذوي الإعاقة البصرية:", "o": ["الخرائط الذهنية", "الكتب الناطقة", "لغة الإشارة", "قراءة الشفاه"], "a": 1 },
  { "t": "الاتصال اللفظي يعتمد على:", "o": ["الإشارات والحركات", "الكلمات المنطوقة والمكتوبة", "تعبيرات الوجه", "لغة الجسد فقط"], "a": 1 },
  { "t": "من مميزات الاتصال اللفظي:", "o": ["صعوبة التعبير", "يمكن اعتباره وثيقة رسمية", "محدود في الاستخدام", "لا يفهمه الجميع"], "a": 1 },
  { "t": "أي مما يلي يُعد اتصالا غير لفظي؟", "o": ["كتابة تقرير", "إرسال بريد إلكتروني", "الابتسامة ولغة الجسد", "التحدث عبر الهاتف"], "a": 2 },
  { "t": "من مهارات الاتصال الفعال:", "o": ["تجاهل مشاعر الآخرين", "استخدام لغة واضحة وموجزة", "الانقطاع عن المتحدث", "استخدام كلمات غير مفهومة"], "a": 1 },
  { "t": "من صفات المرسل الجيد:", "o": ["لا يهتم بالمستقبل", "عدم الاستعداد", "وضوح الهدف من الرسالة", "التعجل في الحديث"], "a": 2 },
  { "t": "الإنصات الجيد يعني:", "o": ["مجرد سماع الأصوات", "التركيز ومتابعة المعنى", "التفكير في الرد دون الاستماع", "تجاهل المتحدث"], "a": 1 },
  { "t": "من أساليب تحسين الإنصات:", "o": ["مقاطعة المتحدث", "عدم تدوين الملاحظات", "التركيز البصري والانتباه", "الانشغال بالهاتف"], "a": 2 },
  { "t": "يهدف الاتصال في بيئة العمل إلى:", "o": ["زيادة الصراعات", "دعم التعاون بين العاملين", "نشر الشائعات", "إخفاء المعلومات"], "a": 1 },
  { "t": "من صور الاتصال في بيئة العمل:", "o": ["البريد الإلكتروني", "الاجتماعات", "التقارير", "جميع ما سبق"], "a": 3 },
  { "t": "من أهداف الاتصال في المؤسسات:", "o": ["تعطيل سير العمل", "تبادل المعلومات واتخاذ قرارات سليمة", "إعاقة التفاعل", "نشر الفوضى"], "a": 1 },
  { "t": "يساعد الاتصال الجيد على:", "o": ["ضعف الانتماء", "زيادة الأخطاء", "تحسين العلاقات المهنية", "إخفاء الحقائق"], "a": 2 },
  { "t": "من معوقات الاتصال:", "o": ["وضوح الرسالة", "الضوضاء والتشويش", "اللغة المناسبة", "التغذية الراجعة"], "a": 1 },
  { "t": "من الوصايا العشر للاتصال الجيد:", "o": ["التسرع في إصدار الأحكام", "تحدث بوضوح وباختصار", "لا تظهر الاهتمام بالآخرين", "اجعل رسالتك غامضة"], "a": 1 },
  { "t": "إحدى الوصايا العامة للاتصال الجيد:", "o": ["تكلم أكثر مما تستمع", "استمع باهتمام للآخرين", "تجاهل التغذية الراجعة", "استخدم تعبيرات غير مناسبة"], "a": 1 },
  { "t": "أي مما يلي يُعد نوعًا من الاتصال الرسمي؟", "o": ["أحاديث الزملاء", "الاجتماعات الإدارية", "المزاح بين العاملين", "الشائعات"], "a": 1 },
  { "t": "من الخصائص الجيدة للرسالة الاتصالية:", "o": ["الغموض", "الطول الزائد", "الوضوح والاختصار", "التعارض"], "a": 2 },
  { "t": "من صفات المرسل الجيد:", "o": ["عدم الاهتمام بالمستقبل", "عدم الانتباه للتغذية الراجعة", "ترتيب الأفكار قبل الإرسال", "استخدام ألفاظ غير مفهومة"], "a": 2 },
  { "t": "التشويش في عملية الاتصال يعني:", "o": ["وضوح الرسالة", "أي عامل يعيق وصول الرسالة", "تفاعل المستقبل", "مراجعة الرسالة"], "a": 1 },
  { "t": "من أمثلة الاتصال الصاعد في المؤسسات:", "o": ["التعليمات والأوامر", "تقارير الموظفين لرئيس العمل", "الإعلانات من الإدارة العليا", "السياسات العامة"], "a": 1 },
  { "t": "من أمثلة الاتصال الهابط:", "o": ["تقديم مقترحات", "معلومات من الرئيس إلى المرؤوس", "الشكاوى", "التغذية الراجعة من الموظف"], "a": 1 },
  { "t": "لغة الجسد تعتبر:", "o": ["نوعًا من الاتصال اللفظي", "نوعا من الاتصال غير اللفظي", "وسيلة رقمية", "وسيلة سمعية فقط"], "a": 1 },
  { "t": "يستخدم ذوو الإعاقة السمعية عادة:", "o": ["طريقة برايل", "لغة الإشارة", "القراءة المكبرة", "الوسائل اللمسية"], "a": 1 },
  { "t": "من مهارات المتحدث الجيد:", "o": ["التشتت أثناء الحديث", "استخدام صوت رتيب", "ترتيب الأفكار ووضوح الصوت", "الإطالة غير الضرورية"], "a": 2 },
  { "t": "من معوقات الاتصال الإداري:", "o": ["استخدام لغة واضحة", "اختلاف الخلفيات الثقافية", "توافر المعلومات", "التدريب المستمر"], "a": 1 },
  { "t": "من طرق تحسين الاتصال الرقمي:", "o": ["استخدام لغة طويلة معقدة", "ضعف سرعة الإنترنت", "الوضوح والدقة في الرسائل الإلكترونية", "تجاهل ردود الآخرين"], "a": 2 },
  { "t": "من الوصايا العشر للاتصال الجيد:", "o": ["لا تستمع كثيرا", "تحدث بلباقة واحترام", "تجنب التنظيم", "استعمل كلمات غامضة"], "a": 1 },
  { "t": "الذي يقوم بتحليل الرسائل وتفسيرها وترجمتها إلى معاني محددة وفك ترميزها هو:", "o": ["المرسل", "الوسيلة", "الرسالة", "المستقبل"], "a": 3 },
  { "t": "هو رد الفعل الذي يبديه المتلقي استجابة لرسالة المرسل:", "o": ["الوسيلة", "المرسل", "التغذية العكسية", "المستقبل"], "a": 2 },
  { "t": "مفهوم الاتصال هو :", "o": ["تبادل المعلومات والآراء", "رد الفعل الذي يبديه المتلقي", "المضمون المراد نقله", "الأفكار والآراء الصادرة من المرسل"], "a": 0 },
  { "t": "الأداة التي تحمل الرسالة من المرسل إلى المستقبل تسمى ب:", "o": ["التغذية العكسية", "قناة الاتصال", "الرسالة", "الاستجابة"], "a": 1 },
  { "t": "واحد مما يأتي ليست من أنواع الاتصال طبقا لمستواه:", "o": ["نازل", "صاعد", "أفقى", "مائل"], "a": 3 },
  { "t": "في هذا النمط يكون جميع أفراد المجموعة على خط واحد:", "o": ["الدائرة", "العجلة", "السلسلة", "الشبكة"], "a": 2 },
  { "t": "في هذا النمط الاتصال يتيح لكل عضو أن يتصل بعضوين فقط من أفراد المجموعة الآخرين:", "o": ["الدائرة", "العجلة", "السلسلة", "الشبكة"], "a": 0 },
  { "t": "الاتصال اجتماعي، معنى ذلك أنه:", "o": ["أن له أسباب", "له أنواع عديدة", "لا يتم إلا في وجود الآخرين", "وراءه دافع"], "a": 2 },
  { "t": "من المهارات الضرورية لأطراف الاتصال الرقمي:", "o": ["القراءة فقط", "الكتابة فقط", "الثقافة الكمبيوترية", "جميع ما سبق"], "a": 3 },

                btn.innerHTML = `<span class="w-6 h-6 rounded-lg bg-white/10 flex items-center justify-center text-[11px] text-cyan-300 shrink-0">${letters[idx] || (idx+1)}</span><span>${opt}</span>`;
                btn.onclick = () => {
                    document.querySelectorAll('.option-btn').forEach(b => b.disabled = true);
                    if (idx === q.a) {
                        btn.classList.add('correct'); correct++; document.getElementById('correct-count').innerText = correct;
                    } else {
                        btn.classList.add('wrong');
                        document.querySelectorAll('.option-btn')[q.a].classList.add('correct');
                        wrong++; document.getElementById('wrong-count').innerText = wrong;
                        wrongList.push({ id: q.id, q: q.t, sel: opt, cor: q.o[q.a] });
                    }
                    setTimeout(() => { curr++; loadQ(); }, 650);
                };
                cont.appendChild(btn);
            });
        }
    </script>

        import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD8H-9qYQwmOxrc0KguLaMXC4TnEzkzVAE",
            authDomain: "basmagia-db.firebaseapp.com",
            projectId: "basmagia-db",
            storageBucket: "basmagia-db.firebasestorage.app",
            messagingSenderId: "856738838094",
            appId: "1:856738838094:web:9d2b84baf32567522cf51f"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const savedUser = JSON.parse(sessionStorage.getItem("basmagia_user") || "{}");
        const fp = btoa(unescape(encodeURIComponent("DEV-" + navigator.userAgent.length + "-" + screen.width + "x" + screen.height))).substring(0, 16);

        const pingOnline = () => {
            setDoc(doc(db, 'online_users', fp), {
                deviceId: fp,
                studentName: savedUser.name || "طالب",
                deviceType: /Mobile|Android|iP(hone|od)/i.test(navigator.userAgent) ? "موبايل 📱" : "كمبيوتر 💻",
                page: "يمتحن: المادة الخامسة",
                lastSeen: Date.now()
            }).catch(() => {});
        };
        setTimeout(pingOnline, 1500);
        setInterval(pingOnline, 45000);

        let selectedStars = 5;
        window.setRating = function(n) {
            selectedStars = n;
            const spans = document.querySelectorAll("#star-rating span");
            spans.forEach((s, idx) => { s.style.opacity = idx < n ? "1" : "0.25"; });
        };

        window.submitStudentFeedback = async function(subjectName, cor, tot) {
            const txtEl = document.getElementById("feedback-text");
            const msg = txtEl ? txtEl.value.trim() : "";
            if (!msg) return;
            const btn = document.getElementById("send-fb-btn");
            btn.disabled = true;
            btn.innerText = "جاري الإرسال...";
            try {
                await setDoc(doc(db, 'student_feedbacks', "FB-" + Date.now()), {
                    timestamp: Date.now(),
                    dateStr: new Date().toLocaleDateString("ar-EG"),
                    timeStr: new Date().toLocaleTimeString("ar-EG", { hour: '2-digit', minute: '2-digit' }),
                    studentName: savedUser.name || "طالب بالفرقة الأولى",
                    subject: subjectName,
                    score: `${cor}/${tot}`,
                    rating: selectedStars,
                    message: msg
                });
                document.getElementById("feedback-box").innerHTML = `<div class="text-emerald-300 font-black text-xs text-center py-2">✅ شكراً لك! وصلت ملاحظتك للإدارة بنجاح ❤️</div>`;
            } catch (e) {
                btn.disabled = false;
                btn.innerText = "📩 إرسال الرأي للإدارة";
            }
        };
    </script>
