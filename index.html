    <!-- ربط قاعدة البيانات السحابية (Firebase Firestore) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, collection, doc, setDoc, getDoc, deleteDoc, updateDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // إعدادات قاعدة البيانات الخاصة بك (basmagia-db)
        const firebaseConfig = {
            apiKey: "AIzaSyD8H-9qYQwmOxrc0KguLaMXC4TnEzkzVAE",
            authDomain: "basmagia-db.firebaseapp.com",
            projectId: "basmagia-db",
            storageBucket: "basmagia-db.firebasestorage.app",
            messagingSenderId: "856738838094",
            appId: "1:856738838094:web:9d2b84baf32567522cf51f",
            measurementId: "G-VT62WZW8TJ"
        };

        let db = null;
        let cloudCodesCache = {};
        let rulesError = false;

        // إنشاء بصمة فريدة لجهاز الطالب لمنع مشاركة الكود مع طالب آخر
        function getDeviceFingerprint() {
            let fp = "DEV-" + navigator.userAgent.length + "-" + screen.width + "x" + screen.height + "-" + navigator.language;
            return btoa(unescape(encodeURIComponent(fp))).substring(0, 16);
        }

        async function initCloudDatabase() {
            try {
                const app = initializeApp(firebaseConfig);
                db = getFirestore(app);

                // الاستماع المباشر للأكواد في قاعدة البيانات
                const codesRef = collection(db, 'student_codes');
                onSnapshot(codesRef, (snapshot) => {
                    rulesError = false;
                    cloudCodesCache = {};
                    snapshot.forEach(d => { cloudCodesCache[d.id] = d.data(); });
                    renderAdminCodesList();
                }, (err) => {
                    console.warn("Firestore Rules Notice:", err);
                    rulesError = true;
                    renderAdminCodesList();
                });
            } catch (e) {
                console.warn("Firebase init notice:", e);
            }
        }
        initCloudDatabase();

        // أكواد الماستر الخاصة بك كأدمن
        const masterCodes = ["20206", "VIP-2026"];

        window.handleLogin = async function(e) {
            e.preventDefault();
            const name = document.getElementById("student-name").value.trim();
            const targetFolderUrl = document.getElementById("student-year").value;
            const code = document.getElementById("activation-code").value.trim().toUpperCase();
            const errBox = document.getElementById("auth-error");
            const btn = document.getElementById("login-btn");

            errBox.classList.add("hidden");
            btn.innerText = "⏳ جاري التحقق من الكود...";
            btn.disabled = true;

            const deviceId = getDeviceFingerprint();

            try {
                // 1. لو الكود هو كود الإدمن السري يفتح فوراً بدون قيود
                if (masterCodes.includes(code)) {
                    sessionStorage.setItem("basmagia_user", JSON.stringify({ name, code, folderUrl: targetFolderUrl, role: "admin" }));
                    window.location.href = targetFolderUrl;
                    return;
                }

                // 2. التحقق من قاعدة البيانات السحابية
                if (db) {
                    const codeDocRef = doc(db, 'student_codes', code);
                    const codeSnap = await getDoc(codeDocRef);

                    if (!codeSnap.exists()) {
                        throw new Error("⚠️ كود التفعيل غير موجود أو غير صحيح!");
                    }

                    const data = codeSnap.data();

                    // التحقق من الفرقة المسموحة للكود
                    if (data.allowedYear && data.allowedYear !== "all" && data.allowedYear !== targetFolderUrl) {
                        throw new Error("⚠️ هذا الكود مخصص لفرقة دراسية أخرى غير التي اخترتها!");
                    }

                    // التحقق من قفل الجهاز (لمنع مشاركة الكود بين الطلاب)
                    if (data.lockedDevice && data.lockedDevice !== deviceId) {
                        throw new Error("🔒 عفواً! هذا الكود تم تفعيله مسبقاً على جهاز طالب آخر ولا يمكن مشاركته.");
                    }

                    // ربط الكود بجهاز الطالب واسمه عند أول دخول
                    await updateDoc(codeDocRef, {
                        lockedDevice: deviceId,
                        studentName: name,
                        lastLogin: new Date().toLocaleString("ar-EG")
                    });

                    sessionStorage.setItem("basmagia_user", JSON.stringify({ name, code, folderUrl: targetFolderUrl }));
                    window.location.href = targetFolderUrl;
                    return;
                } else {
                    throw new Error("⚠️ تعذر الاتصال بقاعدة البيانات حالياً.");
                }
            } catch (err) {
                errBox.innerText = err.message;
                errBox.classList.remove("hidden");
                btn.innerText = "دخول إلى قسم الفرقة ←";
                btn.disabled = false;
            }
        };

        // ==========================================
        // دوال لوحة تحكم الإدمن (توليد وحذف وفك قفل الأكواد)
        // ==========================================
        let clicks = 0;
        window.triggerAdmin = function() {
            clicks++;
            if (clicks >= 5) {
                clicks = 0;
                const pass = document.getElementById("activation-code").value.trim();
                if (pass === "20206") {
                    document.getElementById("admin-modal").classList.remove("hidden");
                    document.getElementById("admin-modal").classList.add("flex");
                    renderAdminCodesList();
                } else {
                    const errBox = document.getElementById("auth-error");
                    errBox.innerText = "💡 لفتح لوحة الإدمن: اكتب كود الإدمن (20206) في خانة كود التفعيل ثم اضغط هنا 5 مرات.";
                    errBox.classList.remove("hidden");
                }
            }
        };

        window.closeAdminModal = function() {
            document.getElementById("admin-modal").classList.add("hidden");
            document.getElementById("admin-modal").classList.remove("flex");
        };

        window.generateCloudCode = async function() {
            if (!db) return;
            const note = document.getElementById("new-code-note").value.trim() || "طالب مشترك";
            const allowedYear = document.getElementById("new-code-year").value;
            let customCode = document.getElementById("custom-code-input").value.trim().toUpperCase();

            if (!customCode) {
                customCode = "BSM-" + Math.floor(1000 + Math.random() * 9000);
            }

            try {
                const codeDocRef = doc(db, 'student_codes', customCode);
                await setDoc(codeDocRef, {
                    code: customCode,
                    note: note,
                    allowedYear: allowedYear,
                    lockedDevice: null,
                    studentName: "",
                    createdAt: new Date().toLocaleDateString("ar-EG")
                });

                document.getElementById("new-code-note").value = "";
                document.getElementById("custom-code-input").value = "";
            } catch (e) {
                rulesError = true;
                renderAdminCodesList();
            }
        };

        window.unlockDevice = async function(code) {
            if (!db) return;
            const codeDocRef = doc(db, 'student_codes', code);
            await updateDoc(codeDocRef, { lockedDevice: null, studentName: "" });
        };

        window.deleteCloudCode = async function(code) {
            if (!db) return;
            const codeDocRef = doc(db, 'student_codes', code);
            await deleteDoc(codeDocRef);
        };

        function renderAdminCodesList() {
            const container = document.getElementById("codes-list");
            if (rulesError) {
                container.innerHTML = `<div class="bg-rose-500/20 border border-rose-400/40 rounded-xl p-3 text-xs text-rose-200 leading-relaxed">
                    ⚠️ <b>تنبيه هام:</b> قاعدة البيانات مقفولة (Locked Mode)!<br>
                    افتح موقع Firebase ثم <b>Firestore Database</b> ثم اضغط على تبويب <b>Rules</b> بالأعلى، وغيّر كلمة <code>if false;</code> إلى <code>if true;</code> ثم اضغط <b>Publish</b>.
                </div>`;
                return;
            }

            const keys = Object.keys(cloudCodesCache);
            if (keys.length === 0) {
                container.innerHTML = `<div class="text-center text-xs text-slate-400 py-6">لا توجد أكواد بعد، اضغط "+ إنشاء وحفظ الكود" بالأعلى!</div>`;
                return;
            }

            container.innerHTML = keys.map(k => {
                const item = cloudCodesCache[k];
                const isLocked = !!item.lockedDevice;
                return `
                    <div class="bg-white/5 border border-white/10 rounded-xl p-2.5 flex items-center justify-between gap-2">
                        <div>
                            <div class="flex items-center gap-2">
                                <span class="font-mono font-black text-xs sm:text-sm text-cyan-300 select-all">${item.code}</span>
                                <span class="text-[10px] px-2 py-0.5 rounded-full font-bold ${isLocked ? 'bg-emerald-500/20 text-emerald-300' : 'bg-amber-500/20 text-amber-300'}">
                                    ${isLocked ? '🔒 مفعل (' + (item.studentName || item.note) + ')' : '🟢 متاح للتفعيل'}
                                </span>
                            </div>
                            <div class="text-[10px] text-slate-400 mt-0.5">المشتري: ${item.note}</div>
                        </div>
                        <div class="flex items-center gap-1.5 shrink-0">
                            ${isLocked ? `<button onclick="unlockDevice('${item.code}')" class="bg-amber-500/20 text-amber-300 px-2 py-1 rounded-lg text-[10px] font-bold" title="فك قفل الجهاز">🔓 فك الجهاز</button>` : ''}
                            <button onclick="deleteCloudCode('${item.code}')" class="bg-rose-500/20 text-rose-300 px-2 py-1 rounded-lg text-[10px] font-bold">حذف</button>
                        </div>
                    </div>
                `;
            }).join('');
        }
    </script>
</body>
</html>
