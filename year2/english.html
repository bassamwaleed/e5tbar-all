<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>بنك الاسئلة مبادئ محاسبة التكاليف   </title>
    <link rel="preconnect" href="https://cdn.tailwindcss.com">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #040711;
            color: #f8fafc;
            height: 100dvh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .ambient-canvas {
            position: fixed; inset: 0; z-index: 0; pointer-events: none;
            background: radial-gradient(circle at 50% 0%, #0f172a 0%, #040711 78%);
        }
        .orb-1 { position: absolute; width: 280px; height: 280px; border-radius: 50%; filter: blur(55px); opacity: 0.4; background: radial-gradient(circle, #06b6d4, #3b82f6); top: -10%; right: -10%; transform: translate3d(0,0,0); }
        .orb-2 { position: absolute; width: 300px; height: 300px; border-radius: 50%; filter: blur(55px); opacity: 0.4; background: radial-gradient(circle, #8b5cf6, #ec4899); bottom: -15%; left: -10%; transform: translate3d(0,0,0); }
        .liquid-glass {
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.82) 0%, rgba(15, 23, 42, 0.62) 100%);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,0.15);
            box-shadow: 0 20px 45px -12px rgba(0, 0, 0, 0.75), inset 0 1px 1px 0 rgba(255, 255, 255, 0.28);
            transform: translate3d(0,0,0);
        }
        .liquid-input { background: rgba(10,15,30,0.85); border: 1px solid rgba(255,255,255,0.16); }
        .setup-box { background: rgba(15,23,42,0.75); border: 1px solid rgba(255,255,255,0.12); transition: 0.2s; }
        .setup-box.active { background: rgba(6,182,212,0.22); border-color: rgba(56,189,248,0.75); box-shadow: 0 0 15px rgba(6,182,212,0.2); }
        .option-btn { background: rgba(255,255,255,0.045); border: 1px solid rgba(255,255,255,0.13); transition: all 0.2s ease; }
        .option-btn:hover:not(:disabled) { background: rgba(255,255,255,0.09); border-color: rgba(56,189,248,0.5); transform: translateX(-3px); }
        .option-btn.correct { background: rgba(16,185,129,0.25) !important; border-color: #10b981 !important; color: #6ee7b7 !important; }
        .option-btn.wrong { background: rgba(244,63,94,0.25) !important; border-color: #f43f5e !important; color: #fda4af !important; }
        .glow-btn { background: linear-gradient(135deg, #06b6d4 0%, #3b82f6 50%, #8b5cf6 100%); box-shadow: 0 10px 25px -5px rgba(59, 130, 246, 0.5); }
    </style>
</head>
<body class="p-3 flex flex-col items-center justify-center">

    <!-- 📢 شريط الإشعارات العاجل (Live Broadcast) -->
    <div id="live-broadcast-bar" class="hidden w-full max-w-2xl mx-auto bg-gradient-to-r from-rose-500/90 via-purple-600/90 to-cyan-500/90 border border-white/25 text-white text-[11px] sm:text-xs font-black py-1.5 px-3.5 text-center z-50 shadow-lg shrink-0 mb-2 rounded-2xl flex items-center justify-between gap-2">
        <span id="live-broadcast-text" class="truncate mx-auto"></span>
        <button onclick="document.getElementById('live-broadcast-bar').classList.add('hidden')" class="text-white/80 hover:text-white text-[10px] font-black px-1.5 rounded bg-black/20 shrink-0">✕</button>
    </div>

    <div class="ambient-canvas"><div class="orb-1"></div><div class="orb-2"></div></div>

    <div class="liquid-glass rounded-3xl p-4 sm:p-6 w-full max-w-2xl max-h-[95dvh] flex flex-col justify-between overflow-hidden relative z-10 flex-1">
        <div class="flex items-center justify-between gap-2 pb-3 mb-2.5 border-b border-white/10 shrink-0">
            <a href="index.html" class="bg-white/5 hover:bg-white/10 border border-white/10 px-3.5 py-2 rounded-xl text-xs sm:text-sm font-extrabold transition">→ مواد الفرقة</a>
            <h1 class="text-sm sm:text-lg font-black text-cyan-300 truncate">🔤 مبادئ محاسبة التكاليف  </h1>
            <button id="reopen-setup" onclick="openSetup()" class="hidden bg-cyan-500/20 border border-cyan-400/40 text-cyan-200 px-3.5 py-2 rounded-xl text-xs sm:text-sm font-black hover:bg-cyan-500/30 transition">⚙️ الإعدادات</button>
        </div>

        <div id="setup-screen" class="space-y-3.5 text-right overflow-y-auto my-auto">
            <div class="bg-slate-900/90 border border-cyan-400/35 rounded-2xl p-4 sm:p-5 space-y-3.5">
                <div class="flex items-center justify-between border-b border-white/10 pb-3">
                    <div>
                        <h2 class="text-sm sm:text-base font-black text-white">⚙️ إعدادات وتخصيص الاختبار</h2>
                        <p class="text-[11px] text-slate-400 mt-0.5">اضبط خياراتك المفضلة قبل الانطلاق</p>
                    </div>
                    <div class="flex items-center gap-2">
                        <span class="text-xs font-black bg-cyan-500/15 text-cyan-300 px-3 py-1.5 rounded-xl border border-cyan-400/30">المتاح: <span id="avail-count">0</span> سؤال</span>
                        <button id="resume-quiz-btn" onclick="resumeQuiz()" class="hidden bg-emerald-500/20 border border-emerald-400/40 text-emerald-300 px-3 py-1.5 rounded-xl text-xs font-black hover:bg-emerald-500/30 transition">
                            ✕ عودة للامتحان
                        </button>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-2.5">
                    <button type="button" id="mode-mcq" onclick="switchMode('mcq')" class="setup-box active p-3 rounded-xl font-black text-xs sm:text-sm text-center">📝 اختيار من متعدد</button>
                    <button type="button" id="mode-tf" onclick="switchMode('tf')" class="setup-box p-3 rounded-xl font-black text-xs sm:text-sm text-center">✅ صح وخطأ</button>
                </div>

                <div class="grid grid-cols-3 gap-2.5 text-center">
                    <button type="button" id="box-shuffle" onclick="toggleShuffle()" class="setup-box p-3 rounded-xl">
                        <div class="text-lg">🔢</div>
                        <div class="font-black text-xs mt-0.5">الترتيب</div>
                        <div id="txt-shuffle" class="text-[11px] text-cyan-300 font-bold mt-0.5">عادي</div>
                    </button>
                    <button type="button" id="box-qnum" onclick="toggleQNum()" class="setup-box active p-3 rounded-xl">
                        <div class="text-lg">🆔</div>
                        <div class="font-black text-xs mt-0.5">رقم السؤال</div>
                        <div id="txt-qnum" class="text-[11px] text-cyan-300 font-bold mt-0.5">ظاهر</div>
                    </button>
                    <button type="button" id="box-timer" onclick="toggleTimer()" class="setup-box p-3 rounded-xl">
                        <div class="text-lg">⏱️</div>
                        <div class="font-black text-xs mt-0.5">المؤقت</div>
                        <div id="txt-timer" class="text-[11px] text-cyan-300 font-bold mt-0.5">معطل</div>
                    </button>
                </div>

                <div id="timer-row" class="hidden bg-amber-500/10 border border-amber-400/30 rounded-xl p-3 items-center justify-between">
                    <span class="text-xs sm:text-sm font-bold text-amber-200">⏳ مدة الاختبار بالدقائق:</span>
                    <input type="number" id="timer-mins" min="1" value="15" class="liquid-input w-20 rounded-lg px-2.5 py-1.5 text-center text-xs sm:text-sm font-black text-amber-300">
                </div>

                <div class="grid grid-cols-2 gap-3 bg-white/[0.03] border border-white/10 p-3 rounded-xl">
                    <div class="flex items-center justify-between">
                        <span class="text-xs sm:text-sm font-bold">من السؤال:</span>
                        <input type="number" id="q-start" min="1" value="1" class="liquid-input w-16 sm:w-20 rounded-lg px-2 py-1.5 text-center text-xs sm:text-sm font-black">
                    </div>
                    <div class="flex items-center justify-between">
                        <span class="text-xs sm:text-sm font-bold">إلى السؤال:</span>
                        <input type="number" id="q-end" min="1" value="10" class="liquid-input w-16 sm:w-20 rounded-lg px-2 py-1.5 text-center text-xs sm:text-sm font-black">
                    </div>
                </div>

                <div class="flex gap-2.5 pt-1">
                    <button type="button" onclick="startQuizNow()" class="glow-btn flex-1 py-3.5 rounded-xl font-black text-sm sm:text-base text-white transition hover:scale-[1.01]">🚀 تطبيق الإعدادات وبدء الاختبار</button>
                    <button type="button" id="resume-bottom-btn" onclick="resumeQuiz()" class="hidden bg-white/10 hover:bg-white/15 text-white font-bold px-4 py-3.5 rounded-xl text-xs sm:text-sm">استكمال الامتحان الحالي</button>
                </div>
            </div>
        </div>

        <div id="quiz-stage" class="hidden flex-col justify-between overflow-hidden flex-1">
            <div class="bg-white/[0.04] border border-white/10 rounded-xl p-1.5 mb-1.5 flex items-center justify-between gap-2 text-xs font-bold shrink-0">
                <div class="flex items-center gap-1.5 flex-wrap">
                    <button onclick="quickToggleQNum()" id="bar-qnum" class="bg-cyan-500/20 text-cyan-300 px-2.5 py-1 rounded-lg border border-cyan-400/30">🆔 الرقم: ظاهر</button>
                    <button onclick="openSetup()" class="bg-white/5 hover:bg-white/10 text-slate-300 px-2.5 py-1 rounded-lg border border-white/10">🎯 النطاق</button>
                    <button onclick="showBookmarks()" id="top-bookmarks-btn" class="hidden bg-amber-500/20 text-amber-300 px-2.5 py-1 rounded-lg border border-amber-400/30">⭐ المحفوظة (<span id="saved-count-top">0</span>)</button>
                </div>
                <span id="timer-disp" class="hidden bg-amber-500/20 text-amber-300 px-2.5 py-1 rounded-lg border border-amber-400/30 font-mono">⏳ 15:00</span>
            </div>

            <div class="w-full h-1.5 bg-white/10 rounded-full overflow-hidden mb-2 shrink-0">
                <div id="progress-fill" class="h-full bg-gradient-to-r from-cyan-400 via-blue-500 to-purple-500 transition-all duration-300" style="width: 0%"></div>
            </div>

            <div class="grid grid-cols-3 gap-2 mb-2 text-center text-xs font-black shrink-0">
                <div class="bg-emerald-500/10 border border-emerald-500/25 rounded-xl py-1.5 text-emerald-400">✅ صح: <span id="correct-count">0</span></div>
                <div class="bg-rose-500/10 border border-rose-500/25 rounded-xl py-1.5 text-rose-400">❌ خطأ: <span id="wrong-count">0</span></div>
                <div class="bg-cyan-500/10 border border-cyan-500/25 rounded-xl py-1.5 text-cyan-300">سؤال <span id="q-curr">1</span> من <span id="q-total">0</span></div>
            </div>

            <div id="quiz-container" class="overflow-y-auto py-0.5 flex-1 flex flex-col justify-start">
            </div>
        </div>
    </div>

    <script>
        if (!sessionStorage.getItem("basmagia_user")) window.location.href = "../index.html";

        const banks = {
    mcq: [
        { "t": "من أهداف محاسبة التكاليف", "o": ["تقدير تكاليف الأنشطة والمنتجات", "حصر وتسجيل التكاليف التاريخية", "الرقابة على التكاليف وتوفير المعلومات", "جميع الاختيارات"], "a": 3 },
        { "t": "تستخدم محاسبة التكاليف في اعداد التقارير الشركات بيانات", "o": ["فعلية", "تقديرية", "فعلية وتقديرية", "لا شيء من الاختيارات"], "a": 2 },
        { "t": "توفر محاسبة التكاليف بيانات", "o": ["اجمالية", "تفصيلية", "تحليلية", "تفصيلية وتحليلية"], "a": 3 },
        { "t": "توفر المحاسبة المالية تقارير", "o": ["خارجية", "الزامية", "خارجية والزامية", "لا شيء من الاختيارات"], "a": 2 },
        { "t": "توفر محاسبة التكاليف تقارير", "o": ["داخلية", "اختيارية", "داخلية واختيارية", "لا شيء من الاختيارات"], "a": 2 },
        { "t": "يستفيد من تقارير محاسبة التكاليف", "o": ["الأطراف الداخلية", "الأطراف الخارجية", "الأطراف الداخلية والخارجية", "لا شيء من الاختيارات"], "a": 0 },
        { "t": "يستفيد من تقارير المحاسبة المالية", "o": ["الأطراف الداخلية", "الأطراف الخارجية", "الأطراف الداخلية والخارجية", "لا شيء من الاختيارات"], "a": 2 },
        { "t": "يعد هدف تحديد تكلفة وحدة المنتج، والرقابة عليها، ومساعدة الإدارة في ترشيد القرارات من أهداف", "o": ["المحاسبة المالية", "محاسبة التكاليف", "المحاسبة الإدارية", "لا شيء من الاختيارات"], "a": 1 },
        { "t": "من مخرجات محاسبة التكاليف", "o": ["قائمة الدخل", "قائمة المركز المالي", "قائمة التدفقات النقدية", "لا شيء من الاختيارات"], "a": 3 },
        { "t": "الموارد المستخدمة أو المضحى بها في سبيل الحصول على سلعة أو خدمة معبرا عنها في شكل نقدي أو مادي", "o": ["التكلفة", "الأصول", "المصروف", "الخسارة"], "a": 0 },
        { "t": "هي منافع مخزنة لدى المنظمة في انتظار استنفادها", "o": ["التكلفة", "الأصول", "المصروف", "الخسارة"], "a": 1 },
        { "t": "هي الجزء المستنفد من التكلفة خلال الفترة ويقابل بالإيراد", "o": ["التكلفة", "الأصول", "المصروف", "الخسارة"], "a": 2 },
        { "t": "هي قيمة الجزء المستنفد من التكلفة خلال الفترة ولم يحقق أي منفعة أو إيراد", "o": ["التكلفة", "الأصول", "المصروف", "الخسارة"], "a": 3 },
        { "t": "يمكن تبويب التكاليف وفقاً لنوعها وطبيعتها إلى تكاليف", "o": ["مواد مباشرة", "أجور مباشرة", "تكاليف إضافية", "جميع الاختيارات"], "a": 3 },
        { "t": "يمكن تبويب التكاليف وفقاً لعلاقتها بوظائف المنشأة إلى تكاليف", "o": ["صناعية", "تسويقية", "إدارية وتمويلية", "جميع الاختيارات"], "a": 3 },
        { "t": "يمكن تبويب التكاليف وفقاً لعلاقتها بوحدة المنتج إلى تكاليف", "o": ["مباشرة وغير مباشرة", "متغيرة وثابتة", "صناعية وتسويقية", "لا شيء من الاختيارات"], "a": 0 },
        { "t": "يمكن تبويب التكاليف وفقاً لتوقيت قياسها إلى تكاليف", "o": ["مباشرة وغير مباشرة", "تاريخية ومقدرة", "متغيرة وثابتة", "لا شيء من الاختيارات"], "a": 1 },
        { "t": "يمكن تبويب التكاليف وفقاً لعلاقتها بمستوى النشاط إلى تكاليف", "o": ["متغيرة", "ثابتة", "مختلطة", "جميع الاختيارات"], "a": 3 },
        { "t": "التكاليف التي تتغير مع تغير حجم النشاط، ويكون نصيب الوحدة منها ثابت هي التكاليف", "o": ["المباشرة", "المتغيرة", "الثابتة", "لا شيء من الاختيارات"], "a": 1 },
        { "t": "التكاليف التي تظل ثابتة في جملتها بغض النظر عن التغير في حجم النشاط، ولكن نصيب الوحدة منها يتغير مع تغير مستوى النشاط هي التكاليف", "o": ["الثابتة", "المتغيرة", "المباشرة", "لا شيء من الاختيارات"], "a": 0 },
        { "t": "التكاليف التي تجمع في خصائصها بين التكاليف المتغيرة والتكاليف الثابتة هي التكاليف", "o": ["المباشرة", "الصناعية", "المختلطة", "لا شيء من الاختيارات"], "a": 2 }
    ],
    tf: [
        { "t": "محاسبة التكاليف هي أحد فروع المحاسبة والتي تهتم بقياس وتسجيل وتحليل التكاليف المتعلقة بأنشطة المنشأة المختلفة بما يوفر المعلومات اللازمة للإدارة بكافة مستوياتها.", "o": ["True", "False"], "a": 0 },
        { "t": "من أهداف محاسبة التكاليف: تقدير تكاليف الأنشطة والمنتجات خلال الفترة القادمة بالشكل الذي يساعد الإدارة على القيام بوظائفها الاساسية من تخطيط ورقابة.", "o": ["True", "False"], "a": 0 },
        { "t": "من أهداف محاسبة التكاليف توفير المعلومات عن التكاليف الملائمة التي تساعد الإدارة على اتخاذ القرارات المختلفة.", "o": ["True", "False"], "a": 0 },
        { "t": "تعتبر محاسبة التكاليف فرعًا من فروع المحاسبة المالية كلاهما نظاماً فرعياً للمعلومات المحاسبية التي لها مدخلات وعمليات ومخرجات.", "o": ["True", "False"], "a": 1 },
        { "t": "تطبق المحاسبة المالية طريقة القيد المزدوج بينما لا تطبق محاسبة التكاليف طريقة القيد المزدوج في اثبات العمليات في السجلات والدفاتر.", "o": ["True", "False"], "a": 1 },
        { "t": "تعتمد محاسبة التكاليف على البيانات المالية بينما تعتمد المحاسبة المالية على البيانات المالية والكمية.", "o": ["True", "False"], "a": 1 },
        { "t": "توفر محاسبة التكاليف بيانات اجمالية بينما توفر المحاسبة المالية بيانات تفصيلية وتحليلية.", "o": ["True", "False"], "a": 1 },
        { "t": "توفر محاسبة التكاليف تقارير خارجية والزامية بينما توفر المحاسبة المالية تقارير داخلية واختيارية.", "o": ["True", "False"], "a": 1 },
        { "t": "يستفيد الأطراف الخارجية من تقارير محاسبة التكاليف بينما يستفيد الأطراف الداخلية فقط من تقارير المحاسبة المالية.", "o": ["True", "False"], "a": 1 },
        { "t": "تعد تقارير المحاسبة المالية وفقا للأسس والقواعد التي تضعها إدارة المنشأة، بينما تعد تقارير محاسبة التكاليف وفقاً لمعايير محاسبية ملزمة ومتفق عليها.", "o": ["True", "False"], "a": 1 },
        { "t": "يعد الهدف من تقارير المحاسبة المالية تحديد تكلفة وحدة المنتج، والرقابة عليها ومساعدة الإدارة في ترشيد القرارات، بينما يعد الهدف تقارير محاسبة التكاليف تحديد نتيجة الأعمال والمركز المالي للمنشأة.", "o": ["True", "False"], "a": 1 },
        { "t": "الأصول: هي الموارد المستخدمة أو المضحى بها في سبيل الحصول على سلعة أو خدمة معبرا عنها في شكل نقدي أو مادي، ويترتب عليها حصول المنشأة على منافع ملموسة أو غير ملموسة.", "o": ["True", "False"], "a": 1 },
        { "t": "التكلفة: هي منافع مخزنة لدى المنظمة في انتظار استنفادها.", "o": ["True", "False"], "a": 1 },
        { "t": "الخسارة هي قيمة الجزء المستنفد من التكلفة خلال الفترة ويقابل بالإيراد.", "o": ["True", "False"], "a": 1 },
        { "t": "المصروف هي قيمة الجزء المستنفد من التكلفة خلال الفترة ولم يحقق أي منفعة أو إيراد.", "o": ["True", "False"], "a": 1 },
        { "t": "يمكن تبويب التكاليف وفقاً لنوعها وطبيعتها إلى تكاليف مواد مباشرة وأجور مباشرة واضافية.", "o": ["True", "False"], "a": 0 },
        { "t": "يمكن تبويب التكاليف وفقاً لعلاقتها بوظائف المنشأة إلى تكايف صناعية وتسويقية وتمويلية وادارية.", "o": ["True", "False"], "a": 0 },

            spans.forEach((s, idx) => { s.style.opacity = idx < n ? "1" : "0.25"; });
        };

        window.submitStudentFeedback = async function(subjectName, cor, tot) {
            const txtEl = document.getElementById("feedback-text");
            const msg = txtEl ? txtEl.value.trim() : "";
            if (!msg) return;
            const btn = document.getElementById("send-fb-btn");
            btn.disabled = true;
            btn.innerText = "جاري الإرسال...";
            try {
                await setDoc(doc(db, 'student_feedbacks', "FB-" + Date.now()), {
                    timestamp: Date.now(),
                    dateStr: new Date().toLocaleDateString("ar-EG"),
                    timeStr: new Date().toLocaleTimeString("ar-EG", { hour: '2-digit', minute: '2-digit' }),
                    studentName: savedUser.name || "طالب بالفرقة الأولى",
                    subject: subjectName,
                    score: `${cor}/${tot}`,
                    rating: selectedStars,
                    message: msg
                });
                document.getElementById("feedback-box").innerHTML = `<div class="text-emerald-300 font-black text-xs text-center py-2">✅ شكراً لك! وصلت ملاحظتك للإدارة بنجاح ❤️</div>`;
            } catch (e) {
                btn.disabled = false;
                btn.innerText = "📩 إرسال الرأي للإدارة";
            }
        };
    </script>
</body>
</html>
