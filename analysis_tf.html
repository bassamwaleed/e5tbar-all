        }

            padding: 20px;
            border: 2px solid #e0e0e0;
            border-radius: 15px;
            cursor: pointer;
            font-size: 1.5em;
            font-family: 'Tajawal', sans-serif;

            color: #555;
            display: flex;
            align-items: center;

            gap: 10px;
        }

        .tf-btn:hover:not(:disabled) {

        }

            border-color: #28a745 !important;
            color: white !important;
        }

            background-color: #dc3545 !important;
            border-color: #dc3545 !important;
            color: white !important;

        }

            background-color: #28a745 !important;
            border-color: #28a745 !important;
            color: white !important;
            opacity: 0.8;
        }

            font-weight: bold;
            color: #764ba2;
            font-size: 1.1em;

        let currentQuestion = 0;
        let score = 0;

        // تحديث العدد الكلي للأسئلة
        document.getElementById('total-q').innerText = questions.length;

        function loadQuestion() {
            const q = questions[currentQuestion];
            document.getElementById('question-text').innerText = q.t;
            document.getElementById('q-curr').innerText = currentQuestion + 1;
            
            // تحديث شريط التقدم
            const progress = ((currentQuestion) / questions.length) * 100;
            document.getElementById('progress-fill').style.width = `${progress}%`;

            // إعادة تفعيل الأزرار وإزالة الألوان
            const btns = document.querySelectorAll('.tf-btn');
            btns.forEach(btn => {
                btn.disabled = false;
                btn.classList.remove('correct-answer', 'wrong-answer', 'show-correct');
            });
        }

        function checkAnswer(userChoice) {
            // تعطيل الأزرار
            const btns = document.querySelectorAll('.tf-btn');
            btns.forEach(btn => btn.disabled = true);

            const correctChoice = questions[currentQuestion].a; // 0 أو 1
            const selectedBtn = document.getElementById('btn-' + userChoice);
            const correctBtn = document.getElementById('btn-' + correctChoice);

            if (userChoice === correctChoice) {
                selectedBtn.classList.add('correct-answer');
                score++;
            } else {
                selectedBtn.classList.add('wrong-answer');
                correctBtn.classList.add('show-correct');
            }

            document.getElementById('score-text').innerText = `النتيجة: ${score} من ${questions.length}`;

            // الانتقال التلقائي
            setTimeout(() => {
                currentQuestion++;
                if (currentQuestion < questions.length) {
                    loadQuestion();
                } else {
                    document.getElementById('progress-fill').style.width = '100%';
                    document.getElementById('quiz-container').innerHTML = `
                        <h3>🎉 انتهى الامتحان!</h3>
                        <p style="font-size:1.5em; margin: 20px 0;">نتيجتك النهائية: <br> <strong>${score}</strong> من <strong>${questions.length}</strong></p>
                        <button class="tf-btn" onclick="location.reload()" style="background:#764ba2; color:white; border:none; width:auto; padding: 15px 30px;">إعادة الاختبار</button>
                    `;
                }
            }, 1200);
        }

        loadQuestion();
    </script>
